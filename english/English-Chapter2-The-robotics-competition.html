<style>
:root {
  --saffron: #E87722; --marigold: #F4A82C; --cream: #FFF8EE; --paper: #FDF6E8;
  --paper-dark: #F5EBD3; --ink: #2B1810; --ink-soft: #5C4332; --leaf: #4A7C59;
  --leaf-light: #E8F4EA; --berry: #B8385E; --berry-light: #FBE9EE; --gold: #D4A53A;
  --sky: #5B8DB8; --sky-light: #E5F0F8; --shadow: rgba(43,24,16,0.12); --shadow-strong: rgba(43,24,16,0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--ink); font-family: 'Nunito', sans-serif; font-size: 16px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle at 20% 30%, rgba(232,119,34,0.04) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(244,168,44,0.06) 0%, transparent 50%); pointer-events: none; z-index: 0; }
.container { max-width: 920px; margin: 0 auto; padding: 24px 20px 80px; position: relative; z-index: 1; }
.brand-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.brand-logo { height: 66px; width: auto; display: block; }
.brand-tagline { font-size: 11px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-soft); opacity: 0.7; }
@media (max-width: 600px) { .brand-logo { height: 50px; } .brand-tagline { display: none; } }
header.app-header { margin-bottom: 28px; padding: 24px 28px; background: linear-gradient(135deg, var(--saffron) 0%, var(--marigold) 100%); border-radius: 24px; color: white; box-shadow: 0 8px 24px var(--shadow); position: relative; overflow: hidden; }
header.app-header::before { content: ''; position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%); border-radius: 50%; }
.header-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.9; margin-bottom: 6px; }
.header-title { font-family: 'Fraunces', serif; font-weight: 900; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; letter-spacing: -0.5px; }
.header-meta { margin-top: 10px; font-size: 14px; opacity: 0.95; font-weight: 600; }
.header-author { margin-top: 6px; font-size: 14px; opacity: 0.85; font-weight: 500; font-style: italic; }
.header-theme-pill { display: inline-block; margin-top: 12px; background: rgba(0,0,0,0.25); color: white; padding: 5px 14px; border-radius: 14px; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; backdrop-filter: blur(4px); }
.reset-btn { position: absolute; top: 16px; right: 16px; background: var(--ink); color: white; border: 2px solid rgba(255,255,255,0.3); padding: 7px 14px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s ease; z-index: 2; }
.reset-btn:hover { background: #1a0e07; border-color: white; transform: translateY(-1px); }
.progress-bar { display: flex; gap: 8px; margin-bottom: 32px; }
.progress-step { flex: 1; padding: 12px 8px; background: var(--paper-dark); border-radius: 12px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; transition: all 0.25s ease; border: 2px solid transparent; user-select: none; position: relative; }
.progress-step:hover { background: var(--cream); border-color: var(--marigold); }
.progress-step.active { background: var(--ink); color: var(--cream); }
.progress-step.complete { background: var(--leaf); color: white; }
.progress-step.locked { opacity: 0.5; cursor: not-allowed; }
.progress-step.locked:hover { background: var(--paper-dark); border-color: transparent; }
.progress-step.complete::after { content: '✓'; position: absolute; top: 4px; right: 6px; font-size: 11px; font-weight: 900; }
.progress-step.locked::after { content: '🔒'; position: absolute; top: 4px; right: 6px; font-size: 10px; }
.step-num { display: block; font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; }
.stage-header { margin-bottom: 24px; }
.stage-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(24px, 4vw, 32px); color: var(--ink); letter-spacing: -0.3px; margin-bottom: 6px; }
.stage-description { color: var(--ink-soft); font-size: 15px; }
.branches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
.branch-card { background: var(--cream); border: 2px solid var(--paper-dark); border-radius: 18px; padding: 24px 20px; cursor: pointer; transition: all 0.25s ease; text-align: center; position: relative; }
.branch-card:hover { border-color: var(--marigold); transform: translateY(-3px); box-shadow: 0 6px 16px var(--shadow); }
.branch-card.complete { border-color: var(--leaf); background: var(--leaf-light); }

/* ===== Stage 0: Deep Dive ===== */
.dd-banner { display: flex; gap: 16px; align-items: center; background: linear-gradient(135deg, var(--sky) 0%, #7BA7CC 100%); color: white; border-radius: 18px; padding: 18px 22px; margin-bottom: 18px; cursor: pointer; box-shadow: 0 4px 14px var(--shadow); transition: all 0.2s ease; border: 2px solid transparent; }
.dd-banner:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shadow-strong); }
.dd-banner.open { border-color: var(--marigold); }
.dd-banner-icon { font-size: 34px; }
.dd-banner-title { font-family: 'Fraunces', serif; font-weight: 900; font-size: 20px; }
.dd-banner-sub { font-size: 13px; opacity: 0.95; }
.dd-topic-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; }
.badge-name, .badge-tagline { display: none; }
.dd-topic-sub { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
.dd-section { background: var(--cream); border: 2px solid var(--paper-dark); border-radius: 18px; padding: 24px; margin-bottom: 20px; }
.dd-section h3 { font-family: 'Fraunces', serif; font-size: 20px; margin-bottom: 14px; color: var(--ink); }
.dd-story p { margin-bottom: 14px; }
.dd-figure { background: white; border: 2px solid var(--paper-dark); border-radius: 14px; padding: 12px; margin: 18px 0 6px; }
.dd-figure svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.dd-caption { font-size: 13px; color: var(--ink-soft); font-style: italic; text-align: center; margin-top: 8px; }
.dd-step { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.dd-step-num { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--saffron); color: white; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.dd-step-body { flex: 1; }
.dd-step-title { font-weight: 800; margin-bottom: 2px; }
.dd-step-example { background: var(--sky-light); border-left: 4px solid var(--sky); border-radius: 0 10px 10px 0; padding: 8px 12px; margin-top: 8px; font-size: 14px; }
.dd-callout { border-radius: 18px; padding: 20px 24px; margin-bottom: 20px; border: 2px solid; }
.dd-callout.tip { background: #FFF3DC; border-color: var(--marigold); }
.dd-callout.funfact { background: var(--sky-light); border-color: var(--sky); }
.dd-callout h3 { font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 8px; }

.branch-card.complete::after { content: '✓'; position: absolute; top: 12px; right: 16px; width: 24px; height: 24px; background: var(--leaf); color: white; border-radius: 50%; line-height: 24px; font-weight: 900; font-size: 14px; }
.branch-icon { font-size: 40px; margin-bottom: 12px; }
.branch-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
.branch-meta { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.branch-meta.stars-meta { color: var(--saffron); letter-spacing: 0.5px; text-transform: none; font-size: 13px; }
.branch-progress { margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
.panel-container { background: white; border-radius: 20px; padding: 32px; box-shadow: 0 4px 16px var(--shadow); margin-bottom: 20px; }
.panel-dots { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.panel-dot { background: var(--paper-dark); color: var(--ink-soft); border: 2px solid transparent; padding: 8px 14px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s ease; min-width: 44px; }
.panel-dot:hover { border-color: var(--marigold); }
.panel-dot.current { background: var(--ink); color: var(--cream); }
.panel-dot.answered { background: var(--leaf); color: white; }
.panel-dot.current.answered { background: var(--ink); border-color: var(--leaf); border-width: 3px; }
.panel-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--paper-dark); }
.panel-counter { font-size: 12px; font-weight: 800; color: var(--saffron); letter-spacing: 1.5px; text-transform: uppercase; }
.panel-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
.narration-text { font-size: 16px; line-height: 1.75; color: var(--ink); margin-bottom: 16px; }
.narration-text .highlight-word { background: linear-gradient(180deg, transparent 60%, rgba(244,168,44,0.4) 60%); cursor: pointer; font-weight: 700; color: var(--ink); border-radius: 2px; transition: background 0.2s ease; position: relative; }
.narration-text .highlight-word:hover { background: linear-gradient(180deg, transparent 30%, rgba(244,168,44,0.7) 30%); }
.word-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; line-height: 1.4; width: max-content; max-width: 240px; text-align: center; z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,0.25); pointer-events: none; }
.word-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--ink); }
.tts-controls { display: flex; gap: 10px; align-items: center; background: var(--sky-light); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; flex-wrap: wrap; }
.tts-btn { background: var(--sky); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
.tts-btn:hover { background: #4a7a9c; }
.tts-btn.playing { background: var(--berry); animation: pulse 1.5s ease-in-out infinite; }
.tts-status { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.comprehension-check { background: var(--cream); border: 2px solid var(--marigold); border-radius: 16px; padding: 20px; margin-top: 16px; }
.check-label { display: inline-block; background: var(--saffron); color: white; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.check-question { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; line-height: 1.4; margin-bottom: 14px; color: var(--ink); }
.options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.option-btn { background: white; border: 2px solid var(--paper-dark); padding: 12px 16px; border-radius: 12px; text-align: left; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--ink); transition: all 0.2s ease; width: 100%; display: flex; align-items: center; gap: 10px; }
.option-btn:hover:not(:disabled) { border-color: var(--marigold); background: var(--paper); transform: translateX(2px); }
.option-letter { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; background: var(--paper-dark); border-radius: 8px; font-weight: 700; font-size: 12px; flex-shrink: 0; color: var(--ink-soft); }
.option-btn.correct { background: var(--leaf-light); border-color: var(--leaf); color: var(--leaf); font-weight: 700; }
.option-btn.correct .option-letter { background: var(--leaf); color: white; }
.option-btn.incorrect { background: var(--berry-light); border-color: var(--berry); color: var(--berry); }
.option-btn.incorrect .option-letter { background: var(--berry); color: white; }
.option-btn:disabled { cursor: default; }
.feedback-box { margin-top: 12px; padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; animation: slideDown 0.3s ease; }
.feedback-box.hint { background: #FFF4D6; border-left: 4px solid var(--gold); color: var(--ink); }
.feedback-box.explanation { background: var(--leaf-light); border-left: 4px solid var(--leaf); color: var(--ink); }
.feedback-label { font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; display: block; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.panel-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.vocab-group-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.vocab-group-tab { background: var(--paper-dark); color: var(--ink-soft); border: 2px solid transparent; padding: 10px 18px; border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s ease; }
.vocab-group-tab:hover { border-color: var(--marigold); }
.vocab-group-tab.active { background: var(--saffron); color: white; }
.vocab-group-tab.complete:not(.active) { background: var(--leaf-light); color: var(--leaf); border-color: var(--leaf); }
.vocab-card { height: 280px; cursor: pointer; perspective: 1000px; }
.vocab-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1); transform-style: preserve-3d; }
.vocab-card.flipped .vocab-card-inner { transform: rotateY(180deg); }
.vocab-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; box-shadow: 0 4px 16px var(--shadow); overflow: hidden; }
.vocab-face.front { background: var(--cream); border: 2px solid var(--paper-dark); align-items: center; justify-content: center; text-align: center; }
.vocab-face.back { background: linear-gradient(135deg, var(--saffron), var(--marigold)); color: white; transform: rotateY(180deg); overflow-y: auto; text-align: left; }
.vocab-card.complete .vocab-face.front { border-color: var(--leaf); background: var(--leaf-light); }
.vocab-card.complete .vocab-face.front::after { content: '✓'; position: absolute; top: 12px; right: 16px; width: 24px; height: 24px; background: var(--leaf); color: white; border-radius: 50%; line-height: 24px; font-weight: 900; font-size: 14px; }
.vocab-word { font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px; color: var(--ink); margin-bottom: 6px; letter-spacing: -0.5px; }
.vocab-source-tag { display: inline-block; background: var(--paper-dark); color: var(--ink-soft); padding: 2px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.vocab-flip-hint { margin-top: 12px; font-size: 11px; color: var(--ink-soft); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: 0.6; }
.vocab-meaning { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; line-height: 1.4; margin-bottom: 10px; }
.vocab-example { font-size: 12px; line-height: 1.45; margin-bottom: 6px; opacity: 0.95; }
.vocab-example-label { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85; margin-bottom: 2px; display: block; }
.spot-it-cta { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.2); border-radius: 10px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.4); }
.spot-it-cta:hover { background: rgba(255,255,255,0.3); }
.modal-overlay { position: fixed; inset: 0; background: rgba(43,24,16,0.7); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content { background: var(--cream); border-radius: 20px; padding: 28px; max-width: 480px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
.modal-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.modal-word { color: var(--saffron); font-style: italic; }
.question-card { background: var(--cream); border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 16px var(--shadow); border: 2px solid var(--paper-dark); }
.question-number { display: inline-block; background: var(--ink); color: var(--cream); font-family: 'Fraunces', serif; font-weight: 700; width: 36px; height: 36px; line-height: 36px; text-align: center; border-radius: 50%; font-size: 16px; margin-bottom: 12px; }
.passage-excerpt { background: var(--paper); padding: 12px 16px; border-radius: 12px; border-left: 4px solid var(--sky); margin-bottom: 12px; font-style: italic; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
.question-text { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; line-height: 1.4; margin-bottom: 14px; color: var(--ink); }
.question-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn { padding: 10px 18px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--paper-dark); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { background: var(--marigold); color: white; }
.btn-primary { background: var(--saffron); color: white; box-shadow: 0 4px 12px rgba(232,119,34,0.3); }
.btn-primary:hover:not(:disabled) { background: var(--ink); transform: translateY(-2px); }
.btn-success { background: var(--leaf); color: white; box-shadow: 0 4px 12px rgba(74,124,89,0.3); }
.btn-success:hover:not(:disabled) { background: #3a6248; transform: translateY(-2px); }
.stage-nav { margin-top: 32px; display: flex; justify-content: space-between; gap: 12px; }
.placeholder-card { background: var(--cream); border: 2px dashed var(--paper-dark); border-radius: 20px; padding: 48px 32px; text-align: center; color: var(--ink-soft); }
.placeholder-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.5; }
.placeholder-title { font-family: 'Fraunces', serif; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
.placeholder-detail { font-size: 14px; line-height: 1.6; max-width: 480px; margin: 0 auto; }
.loading-screen, .error-screen { text-align: center; padding: 48px 20px; }
.spinner { width: 48px; height: 48px; border: 4px solid var(--paper-dark); border-top-color: var(--saffron); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-screen { background: var(--berry-light); border: 2px solid var(--berry); color: var(--berry); border-radius: 16px; }
/* === STAGE 3: THINK DEEPER === */
.think-card { background: var(--cream); border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 16px var(--shadow); border: 2px solid var(--paper-dark); transition: border-color 0.3s ease; }
.think-card.submitted { border-color: var(--leaf); background: linear-gradient(135deg, var(--cream), var(--leaf-light)); }
.scenario-box { background: var(--paper); padding: 14px 16px; border-radius: 12px; border-left: 4px solid var(--marigold); margin: 12px 0 14px 0; font-style: italic; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
.word-limit-tag { display: inline-block; background: var(--sky); color: white; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; }
.text-input { width: 100%; padding: 14px 16px; border: 2px solid var(--paper-dark); border-radius: 12px; font-family: inherit; font-size: 15px; background: white; color: var(--ink); transition: border-color 0.2s ease; line-height: 1.5; }
.text-input:focus { outline: none; border-color: var(--saffron); }
textarea.text-input { resize: vertical; min-height: 100px; }
textarea.text-input[readonly] { background: var(--paper); cursor: default; }
.word-counter { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-align: right; transition: color 0.2s ease; }
.word-counter.in-range { color: var(--leaf); }
.word-counter.over { color: var(--berry); }
.model-answer-box { margin-top: 14px; padding: 16px 18px; background: linear-gradient(135deg, var(--cream), var(--paper-dark)); border-radius: 12px; border: 2px dashed var(--marigold); animation: slideDown 0.4s ease; }
.model-answer-box .feedback-label { color: var(--saffron); }
.model-answer-accordion { margin-top: 14px; background: var(--paper); border-radius: 12px; border: 1px solid var(--paper-dark); overflow: hidden; }
.stars-info-card { margin-top: 24px; background: var(--cream); border-radius: 14px; border: 1px solid var(--paper-dark); overflow: hidden; }
.stars-info-card summary { padding: 14px 18px; cursor: pointer; font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; color: var(--ink); background: var(--cream); transition: background 0.2s ease; user-select: none; list-style: none; position: relative; }
.stars-info-card summary::-webkit-details-marker { display: none; }
.stars-info-card summary::after { content: '▼'; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-soft); transition: transform 0.2s ease; }
.stars-info-card[open] summary::after { transform: translateY(-50%) rotate(180deg); }
.stars-info-card summary:hover { background: var(--paper-dark); }
.stars-info-card[open] summary { background: var(--paper-dark); border-bottom: 1px solid var(--paper-dark); }
.stars-info-body { padding: 16px 20px; font-size: 13px; line-height: 1.6; color: var(--ink); }
.stars-info-body strong { color: var(--saffron); }
.model-answer-accordion summary { padding: 12px 16px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-soft); background: var(--paper); transition: background 0.2s ease; user-select: none; }
.model-answer-accordion summary:hover { background: var(--paper-dark); }
.model-answer-accordion[open] summary { background: var(--paper-dark); border-bottom: 1px solid var(--paper-dark); }
.model-answer-accordion .model-answer-box { margin: 0; border: none; border-radius: 0; background: var(--cream); animation: none; }

/* === SELF-CHECK PANEL === */
.self-check-panel { margin-top: 14px; padding: 16px 18px; background: linear-gradient(135deg, var(--leaf-light), var(--cream)); border-radius: 14px; border: 2px solid var(--leaf); animation: slideDown 0.4s ease; }
.self-check-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.self-check-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; color: var(--leaf); }
.self-check-score { background: var(--leaf); color: white; padding: 5px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.3px; }
.self-check-score.parent { background: var(--berry); }
.self-check-instructions { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
.self-check-list { list-style: none; padding: 0; margin: 0 0 12px 0; }
.self-check-list li { margin-bottom: 8px; }
.self-check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: white; border: 2px solid var(--paper-dark); border-radius: 10px; cursor: pointer; transition: all 0.15s ease; }
.self-check-item:hover { border-color: var(--leaf); }
.self-check-item input[type=checkbox] { margin-top: 3px; flex-shrink: 0; width: 18px; height: 18px; cursor: pointer; accent-color: var(--leaf); }
.self-check-item input[type=checkbox]:checked + .self-check-text { color: var(--leaf); font-weight: 700; }
.self-check-item:has(input[type=checkbox]:checked) { background: var(--leaf-light); border-color: var(--leaf); }
.self-check-text { font-size: 13px; line-height: 1.4; color: var(--ink); }
.word-gate-warning { background: #FFF4D6; color: #8a6510; border-radius: 10px; padding: 10px 12px; font-size: 12px; margin-bottom: 12px; border-left: 4px solid var(--gold); }

.parent-override-row { background: var(--paper); border-radius: 10px; padding: 12px; border: 1px solid var(--paper-dark); margin-top: 8px; }
.parent-override-label { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--ink-soft); flex-wrap: wrap; }
.parent-override-label > span:first-child { color: var(--berry); font-size: 13px; }
.parent-override-input { width: 70px; padding: 6px 10px; border: 2px solid var(--paper-dark); border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 14px; text-align: center; color: var(--ink); background: white; }
.parent-override-input:focus { outline: none; border-color: var(--berry); }
.parent-override-suffix { color: var(--ink-soft); font-weight: 600; }
.parent-override-hint { display: block; margin-top: 6px; font-size: 11px; color: var(--ink-soft); font-style: italic; font-weight: 500; }
.answer-text { margin-top: 6px; line-height: 1.6; color: var(--ink); font-size: 14px; }
.submitted-tag { display: inline-block; margin-left: 8px; background: var(--leaf); color: white; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; vertical-align: middle; }
.marks-tag { display: inline-block; margin-left: 8px; background: var(--ink); color: var(--cream); padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; vertical-align: middle; }

            "type": "story",
            "title": "Arjun Rewrites His Cricket Report",
            "content": "Arjun's teacher had asked the class to write a report on the school cricket match. Arjun wrote his in twenty minutes and read it out to his elder sister, Ananya.\n\n\"Arjun hit the ball. Arjun scored a four. Arjun ran fast. Arjun was happy. Arjun looked at Arjun's captain. Arjun's captain smiled at Arjun. Arjun's team won.\"\n\nAnanya laughed so hard she nearly fell off the sofa. \"Arjun,\" she said, \"who is this report *about*? Arjun, Arjun, Arjun, Arjun. Doesn't your teacher know your name yet?\"\n\n\"But it's true,\" Arjun said, hurt. \"I did all those things.\"\n\n\"I know you did,\" Ananya said. \"But English gives you tiny helper words for when you already know who you're talking about. Watch.\" She took the pencil and rewrote it:\n\n\"Arjun hit the ball. **He** scored a four. **He** ran fast. **He** was happy. **He** looked at **his** captain. **She** smiled at **him**. **Their** team won.\"\n\nArjun stared at the page. It was the same story — but suddenly it sounded like a real report and not a list of Arjun facts.\n\n\"Those little words,\" said Ananya, \"are **pronouns**. They stand in place of names.\"\n\nThen she picked up her pencil again. \"Now let me make it *interesting*.\"\n\n\"Arjun hit the **red** ball. He scored a **quick** four. He ran **very** fast. He was **so** happy. He looked at his **kind** captain. She smiled at him with a **proud** smile. Their **whole** team won a **shining** trophy.\"\n\n\"Those,\" said Ananya, \"are **adjectives**. They describe what something is *like*.\"\n\nArjun read his final report to the class the next day. His teacher gave him nine out of ten. The one mark he lost? He had written \"a shining trophy\" but forgotten to put a full stop at the end.",
            "image_svg": "<svg viewBox=\"0 0 800 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Verdana,sans-serif\">\n  <rect width=\"800\" height=\"520\" fill=\"#FDF6E9\"/>\n  <text x=\"400\" y=\"36\" font-size=\"21\" font-weight=\"bold\" fill=\"#1F4E79\" text-anchor=\"middle\">Two Word-Families That Change Everything</text>\n\n  <g>\n    <rect x=\"40\" y=\"70\" width=\"350\" height=\"200\" rx=\"14\" fill=\"#E5F0F8\" stroke=\"#5B8DB8\" stroke-width=\"2\"/>\n    <text x=\"215\" y=\"100\" font-size=\"18\" font-weight=\"bold\" fill=\"#5B8DB8\" text-anchor=\"middle\">PRONOUNS</text>\n    <text x=\"215\" y=\"122\" font-size=\"12\" fill=\"#3A3A3A\" text-anchor=\"middle\">stand in place of a noun (a name)</text>\n\n    <text x=\"60\" y=\"156\" font-size=\"13\" font-weight=\"bold\" fill=\"#1F4E79\">Subject</text>\n    <text x=\"140\" y=\"156\" font-size=\"13\" fill=\"#3A3A3A\">I, you, he, she, it, we, they</text>\n\n    <text x=\"60\" y=\"180\" font-size=\"13\" font-weight=\"bold\" fill=\"#1F4E79\">Object</text>\n    <text x=\"140\" y=\"180\" font-size=\"13\" fill=\"#3A3A3A\">me, you, him, her, it, us, them</text>\n\n    <text x=\"60\" y=\"204\" font-size=\"13\" font-weight=\"bold\" fill=\"#1F4E79\">Possess.</text>\n    <text x=\"140\" y=\"204\" font-size=\"13\" fill=\"#3A3A3A\">my, your, his, her, its, our, their</text>\n\n    <text x=\"60\" y=\"236\" font-size=\"12\" font-style=\"italic\" fill=\"#5B8DB8\">Rose won the prize.</text>\n    <text x=\"60\" y=\"254\" font-size=\"12\" font-style=\"italic\" fill=\"#4A7C59\">→ SHE won it. HER team clapped.</text>\n  </g>\n\n  <g>\n    <rect x=\"410\" y=\"70\" width=\"350\" height=\"200\" rx=\"14\" fill=\"#FFF0DF\" stroke=\"#E87722\" stroke-width=\"2\"/>\n    <text x=\"585\" y=\"100\" font-size=\"18\" font-weight=\"bold\" fill=\"#E87722\" text-anchor=\"middle\">ADJECTIVES</text>\n    <text x=\"585\" y=\"122\" font-size=\"12\" fill=\"#3A3A3A\" text-anchor=\"middle\">describe what a noun is like</text>\n\n    <text x=\"430\" y=\"156\" font-size=\"13\" font-weight=\"bold\" fill=\"#B8385E\">Quality</text>\n    <text x=\"510\" y=\"156\" font-size=\"13\" fill=\"#3A3A3A\">kind, fast, brave, silly</text>\n\n    <text x=\"430\" y=\"180\" font-size=\"13\" font-weight=\"bold\" fill=\"#B8385E\">Number</text>\n    <text x=\"510\" y=\"180\" font-size=\"13\" fill=\"#3A3A3A\">one, five, many, few</text>\n\n    <text x=\"430\" y=\"204\" font-size=\"13\" font-weight=\"bold\" fill=\"#B8385E\">Colour/Size</text>\n    <text x=\"540\" y=\"204\" font-size=\"13\" fill=\"#3A3A3A\">red, huge, tiny, blue</text>\n\n    <text x=\"430\" y=\"236\" font-size=\"12\" font-style=\"italic\" fill=\"#E87722\">The robot broke down.</text>\n    <text x=\"430\" y=\"254\" font-size=\"12\" font-style=\"italic\" fill=\"#4A7C59\">→ The AMAZING robot BROKEN into pieces.</text>\n  </g>\n\n  <rect x=\"40\" y=\"294\" width=\"720\" height=\"200\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#4A7C59\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"322\" font-size=\"16\" font-weight=\"bold\" fill=\"#4A7C59\" text-anchor=\"middle\">The 2-Question Test</text>\n\n  <text x=\"60\" y=\"354\" font-size=\"13\" font-weight=\"bold\" fill=\"#1F4E79\">Q1. Can I replace this word with a NAME?</text>\n  <text x=\"80\" y=\"374\" font-size=\"13\" fill=\"#3A3A3A\">Yes → it is a PRONOUN.  \"He\" → Arjun. \"They\" → Rob and Rose. \"It\" → the robot.</text>\n\n  <text x=\"60\" y=\"408\" font-size=\"13\" font-weight=\"bold\" fill=\"#B8385E\">Q2. Does the word tell me what a noun is LIKE?</text>\n  <text x=\"80\" y=\"428\" font-size=\"13\" fill=\"#3A3A3A\">Yes → it is an ADJECTIVE.  \"Green\" school → what kind of school. \"Awesome\" robot → what kind of robot.</text>\n\n  <text x=\"60\" y=\"464\" font-size=\"12\" font-style=\"italic\" fill=\"#5C4332\">Watch out: MY, YOUR, HIS, HER, ITS, OUR, THEIR can sit BEFORE a noun. Then they behave like adjectives — but they still come from the pronoun family. Grammar books call them possessive pronouns. Both answers are usually accepted in Class 5.</text>\n</svg>",
            "image_caption": "Pronouns replace names. Adjectives describe things. Two families, two easy questions."

          {
            "type": "steps",
            "title": "The 2-Question Test for Pronouns and Adjectives",
            "steps": [
              {
                "title": "Q1 — Can I put a real NAME in place of this word?",
                "text": "If you can swap the word for a real name (a person's name, or a thing like 'the robot'), it is a **pronoun**.",
                "example": "\"**She** took a video.\" → \"**Rose** took a video.\" ✓ pronoun.  \"**It** stopped working.\" → \"**The robot** stopped working.\" ✓ pronoun.  \"**They** won.\" → \"**Rob and Rose** won.\" ✓ pronoun."
              },
              {
                "title": "Q2 — Does this word tell me what the noun is LIKE?",
                "text": "If the word tells you the *quality*, *number*, *colour* or *size* of a noun, it is an **adjective**. Adjectives usually sit right before the noun.",
                "example": "The **awesome** robot. The **red** school bus. **Two** winners. A **kind** boy. A **broken** wire. A **long** speech."
              },
              {
                "title": "The three main pronoun jobs — learn them together",
                "text": "Pronouns come in three sets, and each set has a job: **subject** (does the action), **object** (receives the action), and **possessive** (shows who owns).",
                "example": "**Subject:** I, you, he, she, it, we, they. — *She won.*  **Object:** me, you, him, her, it, us, them. — *Rose helped him.*  **Possessive:** my, your, his, her, its, our, their. — *That is her robot.*"
              },
              {
                "title": "The trap the exam loves — \"his\", \"her\", \"my\", \"your\", \"our\", \"their\"",
                "text": "These words sit before a noun and *look* like adjectives — but they come from the pronoun family. If the question forces you to choose, pick **possessive pronoun**. If the question asks what work the word is *doing* in the sentence, describing a noun is an adjective's job.",
                "example": "**His** robot broke. → \"his\" comes from the pronoun family (replaces \"Tim's\"). → possessive pronoun.  But it *describes* whose robot → so it also acts like an adjective. Both are correct in Class 5 — read the question carefully."
              }
            ]
          },
          {
            "type": "tip",
            "title": "Remember It Like This",
            "content": "Read any sentence aloud. Every time you meet a word you're not sure about, ask the **2-question test** in this order:\n\n**Q1: Can I replace this with a real name?** → Yes = pronoun.\n**Q2: Is it telling me what the noun is LIKE?** → Yes = adjective.\n\nA quick trick for the six trap-words (**my, your, his, her, our, their**): they *sit* like adjectives but they *come from* the pronoun family. In exam MCQs, the safe answer is usually **possessive pronoun** — unless the question specifically asks 'What kind of word describes the noun?', in which case it is an adjective.\n\nOne more trick: adjectives can come with **very**, **so**, **too** in front of them (*very kind*, *so happy*, *too tall*). Pronouns cannot. So if you can put 'very' in front, it's definitely an adjective."
          },
          {
            "type": "funfact",
            "title": "Did You Know?",
            "content": "Old English (the English of about a thousand years ago) had *twelve* different words for 'you'! Different words for one person, two people, many people, friends, strangers, kings, servants — all separate.\n\nModern English quietly threw them all away and kept just one — \"you\" — for everybody. Which is easier to learn, but the reason your grandmother sometimes says \"thee\" or \"thou\" in old English poems is because that was the special-friend version of \"you\".\n\nAnd here's an even stranger fact: the word **it** used to have both a boy version and a girl version. English kept the neutral \"it\" and threw the other two away. Which is why a table today is not a boy or a girl in English — it is just an \"it\"!"
          }
        ]

      {
        "id": "dd_winning_feelings",
        "title": "Winning Feelings, Losing Lessons",
        "icon": "💫",
        "subtitle": "How to read a character's feelings from what they DO, not just what they say",
        "sections": [
          {
            "type": "story",
            "title": "Kartik Loses to His Little Sister",
            "content": "Kartik was eleven. His sister Ananya was seven. Every Sunday after lunch, they played chess. And every Sunday, for two whole years, Kartik had won.\n\nThen one rainy afternoon in Karnal, with the aunties talking too loudly in the next room, Ananya moved her tiny queen forward and said in her small voice, \"Bhaiya, checkmate.\"\n\nKartik stared at the board.\n\nHe *could* have said, \"Well done, Ananya. Good game.\" That is what a **gracious loser** says — someone who has lost but is still kind.\n\nHe *could* have knocked the pieces over and shouted, \"You cheated! You moved the knight wrong three moves ago!\" That is what a **sore loser** does — someone whose feelings hurt so much that they cannot be fair.\n\nWhat Kartik actually did was — he sat very still, then he stood up without a word, and he walked to the kitchen. His mother saw his face and understood. She did not say anything. She poured him a glass of water.\n\nAfter fifteen minutes, Kartik walked back into the living room. Ananya was still on the floor, quietly putting the chess pieces back in the box. She was not smiling. She was watching him.\n\nKartik sat down opposite her. He held out his hand. \"Well played, Ananya. That was a beautiful checkmate.\"\n\nAnanya's face lit up. \"Bhaiya, will you show me how you *always* win from that position? I want to learn.\"\n\nKartik laughed for the first time all afternoon. That is what **teamwork** looks like — a winner willing to teach, and a loser willing to learn.",
            "image_svg": "<svg viewBox=\"0 0 800 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Verdana,sans-serif\">\n  <rect width=\"800\" height=\"520\" fill=\"#FDF6E9\"/>\n  <text x=\"400\" y=\"36\" font-size=\"21\" font-weight=\"bold\" fill=\"#1F4E79\" text-anchor=\"middle\">Winning and Losing — the Feelings Wheel</text>\n\n  <g>\n    <rect x=\"70\" y=\"80\" width=\"320\" height=\"200\" rx=\"14\" fill=\"#E8F4EA\" stroke=\"#4A7C59\" stroke-width=\"2\"/>\n    <text x=\"230\" y=\"108\" font-size=\"17\" font-weight=\"bold\" fill=\"#4A7C59\" text-anchor=\"middle\">WHEN WE WIN</text>\n\n    <text x=\"90\" y=\"140\" font-size=\"14\" fill=\"#3A3A3A\">😊 <tspan font-weight=\"bold\">proud</tspan> — happy about ourselves</text>\n    <text x=\"90\" y=\"166\" font-size=\"14\" fill=\"#3A3A3A\">🎉 <tspan font-weight=\"bold\">joyful</tspan> — feeling like celebrating</text>\n    <text x=\"90\" y=\"192\" font-size=\"14\" fill=\"#3A3A3A\">🤝 <tspan font-weight=\"bold\">gracious</tspan> — kind to the loser</text>\n    <text x=\"90\" y=\"218\" font-size=\"14\" fill=\"#3A3A3A\">💪 <tspan font-weight=\"bold\">confident</tspan> — sure of ourselves</text>\n    <text x=\"90\" y=\"244\" font-size=\"14\" fill=\"#C0392B\">😏 <tspan font-weight=\"bold\">boastful</tspan> — showing off too much</text>\n    <text x=\"90\" y=\"270\" font-size=\"11\" font-style=\"italic\" fill=\"#5C4332\">green = kind, red = trap</text>\n  </g>\n\n  <g>\n    <rect x=\"410\" y=\"80\" width=\"320\" height=\"200\" rx=\"14\" fill=\"#FBE9EE\" stroke=\"#B8385E\" stroke-width=\"2\"/>\n    <text x=\"570\" y=\"108\" font-size=\"17\" font-weight=\"bold\" fill=\"#B8385E\" text-anchor=\"middle\">WHEN WE LOSE</text>\n\n    <text x=\"430\" y=\"140\" font-size=\"14\" fill=\"#3A3A3A\">😞 <tspan font-weight=\"bold\">disappointed</tspan> — sad, wanted more</text>\n    <text x=\"430\" y=\"166\" font-size=\"14\" fill=\"#3A3A3A\">😔 <tspan font-weight=\"bold\">discouraged</tspan> — feel like giving up</text>\n    <text x=\"430\" y=\"192\" font-size=\"14\" fill=\"#3A3A3A\">🙏 <tspan font-weight=\"bold\">respectful</tspan> — still kind to winner</text>\n    <text x=\"430\" y=\"218\" font-size=\"14\" fill=\"#3A3A3A\">🎯 <tspan font-weight=\"bold\">determined</tspan> — will try harder</text>\n    <text x=\"430\" y=\"244\" font-size=\"14\" fill=\"#C0392B\">😠 <tspan font-weight=\"bold\">bitter</tspan> — angry, blaming others</text>\n    <text x=\"430\" y=\"270\" font-size=\"11\" font-style=\"italic\" fill=\"#5C4332\">green = strong, red = trap</text>\n  </g>\n\n  <rect x=\"70\" y=\"302\" width=\"660\" height=\"192\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#5B8DB8\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"332\" font-size=\"16\" font-weight=\"bold\" fill=\"#5B8DB8\" text-anchor=\"middle\">Reading Feelings from ACTIONS (not just words)</text>\n\n  <text x=\"90\" y=\"362\" font-size=\"13\" fill=\"#3A3A3A\"><tspan font-weight=\"bold\" fill=\"#4A7C59\">Smiles + shakes hand + says \"well played\"</tspan> → gracious winner</text>\n  <text x=\"90\" y=\"386\" font-size=\"13\" fill=\"#3A3A3A\"><tspan font-weight=\"bold\" fill=\"#C0392B\">Laughs at the loser + shouts \"I told you!\"</tspan> → boastful winner</text>\n  <text x=\"90\" y=\"410\" font-size=\"13\" fill=\"#3A3A3A\"><tspan font-weight=\"bold\" fill=\"#4A7C59\">Head down + quiet + then congratulates</tspan> → gracious loser</text>\n  <text x=\"90\" y=\"434\" font-size=\"13\" fill=\"#3A3A3A\"><tspan font-weight=\"bold\" fill=\"#C0392B\">Blames the referee + refuses to shake hands</tspan> → sore loser</text>\n  <text x=\"90\" y=\"466\" font-size=\"12\" font-style=\"italic\" fill=\"#5C4332\">Watch what a character DOES with their hands, face and mouth — the feeling is hidden there.</text>\n</svg>",
            "image_caption": "Green feelings make us stronger. Red feelings are traps. Watch the character's actions to know which is which."
          },
          {
            "type": "steps",
            "title": "Reading a Character's Feelings",
            "steps": [
              {
                "title": "Step 1 — Look at what the character does with their BODY",
                "text": "Writers rarely say 'she felt disappointed'. They show it: **body language** — how the character sits, walks, holds their hands, looks at people. Ask what the body is telling you.",
                "example": "Kartik sat *very still*, then *walked to the kitchen* without a word → he is upset but trying to control himself. He didn't say \"I'm upset\" — his body said it for him."
              },
              {
                "title": "Step 2 — Look at what the character says (and does NOT say)",
                "text": "Sometimes the biggest feeling is in the words a character *refuses* to say. Silence is loud in stories.",
                "example": "Tim doesn't say anything when the Green Hill boy asks, \"I don't understand. It was working before.\" His **silence** is the feeling — guilt."
              },
              {
                "title": "Step 3 — Notice the CHANGE from beginning to end",
                "text": "A character's feelings almost always change during a story. Compare the first mention to the last mention of that character's feelings.",
                "example": "Rob at the start: \"I hope we do well.\" — hopeful. Rob at the end: helping expose the truth even though it means Tim (his own teammate) gets in trouble — brave and honest."
              },
              {
                "title": "Step 4 — Match feelings to the theme",
                "text": "In a 'winning and losing' story, most feelings will belong to one of two families: **kind and gracious** (green feelings) or **bitter and boastful** (red feelings). Which family is your character in?",
                "example": "Rob, Rose and (finally) Tim → green family — they choose honesty. The Green Hill boy who says \"I don't understand\" → gracious loser at first. The judge → gracious winner (of the situation) — he chooses TWO winners instead of picking sides."
              }
            ]
          },
          {
            "type": "tip",
            "title": "Remember It Like This",
            "content": "Every 'winning and losing' word comes in **opposite pairs**. Learn them as pairs, not one by one:\n\n**Winner pairs:**\n- gracious winner ↔ boastful winner\n- respectful ↔ rude\n- humble ↔ proud (too proud)\n\n**Loser pairs:**\n- gracious loser ↔ sore loser\n- determined ↔ discouraged\n- honest ↔ blaming others\n\n**The exam's favourite trick** is to ask you which pair a character belongs to. Look at three things: their **words**, their **actions**, and how they change **at the end**. If you know the pair, you know the answer."
          },
          {
            "type": "funfact",
            "title": "Did You Know?",
            "content": "The word **sport** originally didn't mean cricket or football at all. It came from an old word that just meant **fun** — 'to disport oneself' meant 'to enjoy yourself'.\n\nSo when English says \"be a good sport\", it isn't asking you to be good at football — it is asking you to be good at *having fun even when you don't win*. Which is the whole idea of sportsmanship in one word.\n\nAnd here's a beautiful phrase from Hindi that means the same thing: **\"khel bhaavna\"** — *the spirit of the game*. It doesn't matter which language you speak. Every culture in the world has a word for the person who plays fairly, wins with grace, and loses with a smile."
          }
        ]
      }

  validateSchema() {
    const required = ['chapter_id', 'chapter_title', 'subject', 'stage_1_learn', 'stage_2_practice'];
    const missing = required.filter(f => !this.data[f]);
    if (missing.length > 0) throw new Error(`JSON missing fields: ${missing.join(', ')}`);
  },

  storageKey() { return `egurukul_${this.data.chapter_id}`; },

  // Bump this when schema or state shape changes — old state will be discarded
  STATE_VERSION: 9,

  loadProgress() {
    try {
      const saved = localStorage.getItem(this.storageKey());
      if (saved) {
        const p = JSON.parse(saved);
        if (p.stateVersion !== this.STATE_VERSION) {
          console.log('Old state version detected, starting fresh');
          localStorage.removeItem(this.storageKey());
          return;
        }
        this.state.panelChecks = p.panelChecks || {};
        this.state.cardFlips = p.cardFlips || {};
        this.state.spotItAnswers = p.spotItAnswers || {};
        this.state.practiceAnswers = p.practiceAnswers || {};
        this.state.thinkSubmissions = p.thinkSubmissions || {};
        this.state.selfCheckTicks = p.selfCheckTicks || {};
        this.state.parentOverrides = p.parentOverrides || {};
        this.state.testAnswers = p.testSubmitted ? (p.testAnswers || {}) : {};
        this.state.testSubmitted = p.testSubmitted || false;
        this.currentStage = p.currentStage || 1;
      }
    } catch (e) { console.warn(e); }
  },

  saveProgress() {
    try {
      localStorage.setItem(this.storageKey(), JSON.stringify({
        stateVersion: this.STATE_VERSION,
        panelChecks: this.state.panelChecks,
        cardFlips: this.state.cardFlips,
        spotItAnswers: this.state.spotItAnswers,
        practiceAnswers: this.state.practiceAnswers,
        thinkSubmissions: this.state.thinkSubmissions,
        selfCheckTicks: this.state.selfCheckTicks,
        parentOverrides: this.state.parentOverrides,
        testAnswers: this.state.testSubmitted ? this.state.testAnswers : {},
        testSubmitted: this.state.testSubmitted,
        currentStage: this.currentStage,
      }));
    } catch (e) { console.warn(e); }
  },

  resetProgress() {
    if (confirm('Reset all your progress in this chapter? You will start fresh from Stage 1.')) {
      localStorage.removeItem(this.storageKey());
      this.state.panelChecks = {};
      this.state.cardFlips = {};
      this.state.spotItAnswers = {};
      this.state.practiceAnswers = {};
      this.state.thinkSubmissions = {};
      this.state.selfCheckTicks = {};
      this.state.parentOverrides = {};
      this.state.testAnswers = {};
      this.state.testStartTime = null;
      this.state.testTimeUp = false;
      this.state.testSubmitted = false;
      this.currentStage = 1;
      this.currentBranch = null;
      this.currentSection = null;
      this.currentPanelIdx = 0;
      this.currentVocabGroup = null;
      this.stopTimer();
      this.render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  },

  isBranchComplete(branch) {
    if (branch.type === 'story_panels') {
      return branch.panels.every(p => !p.comprehension_check || (this.state.panelChecks[p.id] && this.state.panelChecks[p.id].selected !== undefined));
    }
    if (branch.type === 'vocabulary_cards') {
      return branch.cards.every(c => this.state.spotItAnswers[c.id] !== undefined);
    }
    return false;
  },

  countAnsweredPanels(branch) {
    if (!branch.panels) return 0;
    return branch.panels.filter(p =>
      !p.comprehension_check ||
      (this.state.panelChecks[p.id] && this.state.panelChecks[p.id].selected !== undefined)
    ).length;
  },

  isStage1Complete() { return this.data.stage_1_learn.branches.every(b => this.isBranchComplete(b)); },

  isPracticeSectionComplete(section) {
    return section.questions.every(q => this.state.practiceAnswers[q.id] && this.state.practiceAnswers[q.id].selected !== undefined);
  },

  isStage2Complete() { return this.data.stage_2_practice.sections.every(s => this.isPracticeSectionComplete(s)); },

  isStage3Complete() {
    const problems = this.data.stage_3_think.problems;
    return problems.every(p => this.state.thinkSubmissions[p.id] && this.state.thinkSubmissions[p.id].submitted);
  },

  isStage4Complete() { return this.state.testSubmitted; },

  isStageComplete(n) {
    if (n === 0) return true; // Deep Dive is optional browsing, never gates
    if (n === 1) return this.isStage1Complete();
    if (n === 2) return this.isStage2Complete();
    if (n === 3) return this.isStage3Complete();
    if (n === 4) return this.isStage4Complete();
    return false;
  },

  isStageUnlocked(n) {
    if (n === 0) return true;
    if (n === 1) return true;
    return this.isStageComplete(n - 1);
  },

  render() {
    const app = document.getElementById('app');
    app.innerHTML = `
      ${this.renderBrandBar()}
      ${this.renderHeader()}
      ${this.renderDDBanner()}
      ${this.renderProgressBar()}
      <div>
        ${this.currentStage === 0 ? this.renderStage0() : ''}
        ${this.currentStage === 1 ? this.renderStage1() : ''}
        ${this.currentStage === 2 ? this.renderStage2() : ''}
        ${this.currentStage === 3 ? this.renderStage3() : ''}
        ${this.currentStage === 4 ? this.renderStage4() : ''}
      </div>
      ${this.state.spotItModal ? this.renderSpotItModal() : ''}
    `;
    // bindEvents is now called ONCE in init(), not here
  },

  renderError(msg) {
    document.getElementById('app').innerHTML = `
      <div class="error-screen">
        <h2 style="font-family: 'Fraunces', serif; margin-bottom: 12px;">Couldn't load the chapter</h2>
        <p>${this.escapeHtml(msg)}</p>
        <p style="font-size: 13px; margin-top: 12px;">Make sure the JSON file is in the same folder, or paste it inside the embedded-chapter script tag.</p>
      </div>
    `;
  },

  renderBrandBar() {
    return `
      <div class="brand-bar">
        <img class="brand-logo" src="${this.LOGO_SRC}" alt="e-Gurukul by Levelup5Tutor">
        <div class="brand-tagline">Home Learning Studio</div>
      </div>`;
  },

  renderHeader() {
    const d = this.data;
    let title = d.chapter_title;
    if (d.chapter_number) title = `Chapter ${d.chapter_number} — ${title}`;
    const books = Array.isArray(d.books) ? d.books.join(' + ') : (d.book || '');
    const themeShort = d.theme_short || (d.theme ? d.theme.split(',')[0].trim() : '');
    return `
      <header class="app-header">
        <div class="header-eyebrow">${this.escapeHtml(d.subject || '')} · Class 5</div>
        <h1 class="header-title">${this.escapeHtml(title)}</h1>
        ${d.chapter_author ? `<div class="header-author">by ${this.escapeHtml(d.chapter_author)}</div>` : ''}
        ${themeShort ? `<div class="header-theme-pill">Theme — ${this.escapeHtml(themeShort)}</div>` : ''}
        ${books ? `<div class="header-meta">${this.escapeHtml(books)}</div>` : ''}
        <button class="reset-btn" data-reset-progress="1" title="Clear all progress and start fresh">↻ Reset</button>
      </header>
    `;
  },

  renderProgressBar() {
    const stages = [{num:1,label:'Learn'},{num:2,label:'Practice'},{num:3,label:'Think'},{num:4,label:'Test'}];
    return `<div class="progress-bar">${stages.map(s => {
      const isActive = this.currentStage === s.num;
      const isComplete = this.isStageComplete(s.num);
      const isLocked = !this.isStageUnlocked(s.num) && !isActive;
      let cls = '';
      if (isActive) cls = 'active';
      else if (isComplete) cls = 'complete';
      else if (isLocked) cls = 'locked';
      return `<div class="progress-step ${cls}" data-stage="${s.num}"><span class="step-num">${s.num}</span><span>${s.label}</span></div>`;
    }).join('')}</div>`;
  },

  renderDDBanner() {
    const dd = this.data.stage_0_deep_dive;
    if (!dd) return '';
    return `
      <div class="dd-banner ${this.currentStage === 0 ? 'open' : ''}" data-dd-banner="1">
        <div class="dd-banner-icon">📚</div>
        <div>
          <div class="dd-banner-title">Deep Dive — ${this.escapeHtml((dd.title || '').replace(/^Deep Dive\s*—\s*/i, ''))}</div>
          <div class="dd-banner-sub">${this.escapeHtml(dd.description || '')} Explore here anytime — it never affects your stars.</div>
        </div>
      </div>`;
  },

  ddMd(text) {
    // markdown-lite: escape first, then **bold**, *italic*, double-newline paragraphs
    const esc = this.escapeHtml(text || '');
    const inline = esc
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
    return inline.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  },

  renderStage0() {
    const dd = this.data.stage_0_deep_dive;
    if (!dd) return '';
    if (this.currentDDTopic) {
      const topic = dd.topics.find(t => t.id === this.currentDDTopic);
      if (topic) return this.renderDDTopic(topic);
    }
    return `
      <div class="stage-header">
        <h2 class="stage-title">🔎 ${this.escapeHtml(dd.title)}</h2>
        <p class="stage-description">${this.escapeHtml(dd.description || '')}</p>
      </div>
      <div class="branches-grid">${dd.topics.map(t => `
        <div class="branch-card" data-dd-topic="${t.id}">
          <div class="branch-icon">${t.icon || '📚'}</div>
          <div class="branch-title">${this.escapeHtml(t.title)}</div>
          <div class="dd-topic-sub">${this.escapeHtml(t.subtitle || '')}</div>
        </div>`).join('')}
      </div>
    `;
  },

  renderDDTopic(topic) {
    const sections = (topic.sections || []).map(s => {
      if (s.type === 'story') {
        return `<div class="dd-section dd-story">
          <h3>📖 ${this.escapeHtml(s.title)}</h3>
          ${this.ddMd(s.content)}
          ${s.image_svg ? `<div class="dd-figure">${s.image_svg}</div>` : ''}
          ${s.image_caption ? `<div class="dd-caption">${this.escapeHtml(s.image_caption)}</div>` : ''}
        </div>`;
      }
      if (s.type === 'steps') {
        return `<div class="dd-section">
          <h3>🪜 ${this.escapeHtml(s.title)}</h3>
          ${(s.steps || []).map((st, i) => `
            <div class="dd-step">
              <div class="dd-step-num">${i + 1}</div>
              <div class="dd-step-body">
                <div class="dd-step-title">${this.escapeHtml(st.title)}</div>
                <div>${this.ddMd(st.text)}</div>
                ${st.example ? `<div class="dd-step-example"><strong>e.g.</strong> ${this.ddMd(st.example)}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>`;
      }
      if (s.type === 'tip') {
        return `<div class="dd-callout tip"><h3>💡 ${this.escapeHtml(s.title)}</h3>${this.ddMd(s.content)}</div>`;
      }
      if (s.type === 'funfact') {
        return `<div class="dd-callout funfact"><h3>🤔 ${this.escapeHtml(s.title)}</h3>${this.ddMd(s.content)}</div>`;
      }
      return '';
    }).join('');
    const topics = this.data.stage_0_deep_dive.topics;
    const idx = topics.findIndex(t => t.id === topic.id);
    const prev = idx > 0 ? topics[idx - 1] : null;
    const next = idx < topics.length - 1 ? topics[idx + 1] : null;
    return `
      <div class="stage-header">
        <h2 class="stage-title">${topic.icon || ''} ${this.escapeHtml(topic.title)}</h2>
        <p class="stage-description">${this.escapeHtml(topic.subtitle || '')}</p>
      </div>
      ${sections}
      <div class="dd-topic-nav">
        ${prev ? `<button class="btn btn-secondary" data-dd-topic="${prev.id}">← Previous Topic</button>` : '<div></div>'}
        ${next ? `<button class="btn btn-primary" data-dd-topic="${next.id}">Next Topic →</button>` : '<div></div>'}
      </div>
    `;
  },

  renderStage1() {
    const s = this.data.stage_1_learn;
    if (this.currentBranch) {
      const branch = s.branches.find(b => b.id === this.currentBranch);
      if (branch) {
        if (branch.type === 'story_panels') return this.renderStoryPanelView(branch);
        if (branch.type === 'vocabulary_cards') return this.renderVocabCardsView(branch);
      }
    }
    return `
      <div class="stage-header">
        <h2 class="stage-title">${this.escapeHtml(s.title)}</h2>
        <p class="stage-description">${this.escapeHtml(s.description)}</p>
      </div>
      <div class="branches-grid">${s.branches.map(b => {
        const complete = this.isBranchComplete(b);
        let progress = '';
        let starsEarned = 0, starsPossible = 0;
        if (b.type === 'story_panels') {
          const total = b.panels.length;
          const done = b.panels.filter(p => !p.comprehension_check || (this.state.panelChecks[p.id] && this.state.panelChecks[p.id].selected !== undefined)).length;
          progress = `${done} / ${total} panels`;
          // 1 ⭐ per correct comprehension check
          b.panels.forEach(p => {
            if (p.comprehension_check) {
              starsPossible += 1;
              const a = this.state.panelChecks[p.id];
              if (a && a.selected === p.comprehension_check.correct) starsEarned += 1;
            }
          });
        } else if (b.type === 'vocabulary_cards') {
          const total = b.cards.length;
          const done = b.cards.filter(c => this.state.spotItAnswers[c.id] !== undefined).length;
          progress = `${done} / ${total} words`;
          // 1 ⭐ per correct spot-it
          b.cards.forEach(c => {
            if (c.spot_it) {
              starsPossible += 1;
              const a = this.state.spotItAnswers[c.id];
              if (a && a.correct) starsEarned += 1;
            }
          });
        }
        return `<div class="branch-card ${complete ? 'complete' : ''}" data-enter-branch="${this.escapeAttr(b.id)}">
          <div class="branch-icon">${b.icon || '📖'}</div>
          <div class="branch-title">${this.escapeHtml(b.title)}</div>
          <div class="branch-meta stars-meta">⭐ ${starsEarned} / ${starsPossible} stars</div>
          <div class="branch-progress">${progress}</div>
        </div>`;
      }).join('')}</div>
      ${this.renderStarsInfoCard(1)}
      ${this.renderStageNav()}
    `;
  },

  renderStoryPanelView(branch) {
    const idx = this.currentPanelIdx;
    const panel = branch.panels[idx];
    const total = branch.panels.length;
    const check = this.state.panelChecks[panel.id] || {};
    const isAnswered = check.selected !== undefined;

    return `
      <div class="stage-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-back-to-branches="1">← Back</button>
        <div>
          <h2 class="stage-title" style="font-size:22px;margin:0;">${this.escapeHtml(branch.title)}</h2>
          <p class="stage-description" style="font-size:13px;">${this.escapeHtml(branch.story_title || '')}${branch.story_author ? ' · by ' + this.escapeHtml(branch.story_author) : ''}</p>
        </div>
      </div>
      <div class="panel-dots">
        ${branch.panels.map((p, i) => {
          const answered = !p.comprehension_check || (this.state.panelChecks[p.id] && this.state.panelChecks[p.id].selected !== undefined);
          const isCurrent = i === idx;
          let cls = 'panel-dot';
          if (isCurrent) cls += ' current';
          if (answered) cls += ' answered';
          return `<button class="${cls}" data-jump-to-panel="${i}" title="Panel ${i+1}: ${this.escapeAttr(p.panel_title)}">${i+1}${answered ? ' ✓' : ''}</button>`;
        }).join('')}
      </div>
      <div class="panel-container">
        <div class="panel-meta">
          <span class="panel-counter">Panel ${idx + 1} of ${total}</span>
          <span style="font-size:11px;color:var(--ink-soft);font-weight:700;">${this.countAnsweredPanels(branch)} of ${total} checks answered</span>
        </div>
        <h3 class="panel-title">${this.escapeHtml(panel.panel_title)}</h3>
        <div class="narration-text">${this.renderNarrationWithHighlights(panel)}</div>
        ${panel.comprehension_check ? this.renderComprehensionCheck(panel) : ''}
      </div>
      <div class="panel-nav">
        ${idx > 0 ? `<button class="btn btn-secondary" data-panel-nav="prev">← Previous Panel</button>` : `<button class="btn btn-secondary" disabled>← Previous Panel</button>`}
        ${idx < total - 1
          ? `<button class="btn btn-primary" data-panel-nav="next" ${panel.comprehension_check && !isAnswered ? 'disabled' : ''}>Next Panel →</button>`
          : `<button class="btn btn-success" data-panel-nav="finish-branch" ${!this.isBranchComplete(branch) ? 'disabled' : ''}>${this.isBranchComplete(branch) ? '✓ Finish ' + this.escapeHtml(branch.title) : 'Answer all panels to finish'}</button>`}
      </div>
    `;
  },

  renderNarrationWithHighlights(panel) {
    let text = panel.narration_text;
    if (panel.highlighted_words && panel.highlighted_words.length > 0) {
      const sorted = [...panel.highlighted_words].sort((a, b) => b.word.length - a.word.length);
      sorted.forEach((hw) => {
        const escaped = hw.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b(${escaped})\\b`, 'gi');
        const dataIdx = panel.highlighted_words.indexOf(hw);
        text = text.replace(regex, (match) => `<span class="highlight-word" data-word-idx="${dataIdx}" data-panel-id="${this.escapeAttr(panel.id)}">${match}</span>`);
      });
    }
    return text;
  },

  renderComprehensionCheck(panel) {
    const check = panel.comprehension_check;
    const ans = this.state.panelChecks[panel.id] || {};
    const isAnswered = ans.selected !== undefined;
    return `
      <div class="comprehension-check">
        <span class="check-label">Quick Check${check.marks ? ' · ⭐ ' + check.marks : ''}</span>
        <p class="check-question">${this.escapeHtml(check.question)}</p>
        <ul class="options-list">${check.options.map((opt, i) => {
          let cls = 'option-btn';
          if (isAnswered) {
            if (i === check.correct) cls += ' correct';
            else if (i === ans.selected) cls += ' incorrect';
          }
          return `<li><button class="${cls}" data-panel-check="${this.escapeAttr(panel.id)}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
            <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
          </button></li>`;
        }).join('')}</ul>
        ${isAnswered && check.explanation ? `
          <div class="feedback-box explanation">
            <span class="feedback-label">${ans.selected === check.correct ? '✓ Correct!' : "Let's understand"}</span>
            ${this.escapeHtml(check.explanation)}
          </div>` : ''}
      </div>
    `;
  },

  renderVocabCardsView(branch) {
    // Group cards by source for cleaner browsing
    const groups = {};
    branch.cards.forEach(c => {
      const src = c.source || 'Words';
      if (!groups[src]) groups[src] = [];
      groups[src].push(c);
    });

    // If we don't have a sub-view selected, default to first group
    const sources = Object.keys(groups);
    if (!this.currentVocabGroup || !groups[this.currentVocabGroup]) {
      this.currentVocabGroup = sources[0];
    }
    const activeCards = groups[this.currentVocabGroup] || [];

    // Group completion stats
    const groupTabs = sources.map(src => {
      const cards = groups[src];
      const done = cards.filter(c => this.state.spotItAnswers[c.id] !== undefined).length;
      const isActive = src === this.currentVocabGroup;
      const isComplete = done === cards.length;
      return `<button class="vocab-group-tab ${isActive ? 'active' : ''} ${isComplete ? 'complete' : ''}" data-vocab-group="${this.escapeAttr(src)}">
        ${this.escapeHtml(src)} <span style="opacity:0.7;font-size:11px;">(${done}/${cards.length})${isComplete ? ' ✓' : ''}</span>
      </button>`;
    }).join('');

    // Decide bottom-right button:
    //  - If current tab is complete AND another tab is incomplete → "Next: [tab] →"
    //  - Else if all tabs complete → "✓ Branch Complete · Back"
    //  - Else → "Save & Back"
    const currentTabDone = activeCards.every(c => this.state.spotItAnswers[c.id] !== undefined);
    const allTabsDone = this.isBranchComplete(branch);
    let nextIncompleteTab = null;
    if (currentTabDone && !allTabsDone) {
      for (const src of sources) {
        if (src === this.currentVocabGroup) continue;
        const cards = groups[src];
        const allDone = cards.every(c => this.state.spotItAnswers[c.id] !== undefined);
        if (!allDone) { nextIncompleteTab = src; break; }
      }
    }

    let bottomBtn;
    if (nextIncompleteTab) {
      bottomBtn = `<button class="btn btn-primary" data-vocab-group="${this.escapeAttr(nextIncompleteTab)}">Next: ${this.escapeHtml(nextIncompleteTab)} →</button>`;
    } else if (allTabsDone) {
      bottomBtn = `<button class="btn btn-success" data-back-to-branches="1">✓ Branch Complete · Back</button>`;
    } else {
      bottomBtn = `<button class="btn btn-secondary" data-back-to-branches="1">Save & Back</button>`;
    }

    return `
      <div class="stage-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-back-to-branches="1">← Back</button>
        <div>
          <h2 class="stage-title" style="font-size:22px;margin:0;">${this.escapeHtml(branch.title)}</h2>
          <p class="stage-description" style="font-size:13px;">Tap each card to see meaning, then test yourself with "Spot it!"</p>
        </div>
      </div>
      <div class="vocab-group-tabs">${groupTabs}</div>
      <div class="cards-grid">${activeCards.map(c => this.renderVocabCard(c)).join('')}</div>
      <div class="stage-nav">
        <div></div>
        ${bottomBtn}
      </div>
    `;
  },

  renderVocabCard(card) {
    const flipped = this.state.cardFlips[card.id];
    const spotAnswered = this.state.spotItAnswers[card.id] !== undefined;
    return `
      <div class="vocab-card ${flipped ? 'flipped' : ''} ${spotAnswered ? 'complete' : ''}" data-flip-card="${this.escapeAttr(card.id)}">
        <div class="vocab-card-inner">
          <div class="vocab-face front">
            <div class="vocab-source-tag">${this.escapeHtml(card.source || 'Word')}</div>
            <div class="vocab-word">${this.escapeHtml(card.word)}</div>
            <div class="vocab-flip-hint">Tap to reveal</div>
          </div>
          <div class="vocab-face back">
            <div class="vocab-meaning">${this.escapeHtml(card.meaning)}</div>
            ${card.example_from_story ? `<div><span class="vocab-example-label">From the story</span><p class="vocab-example">${this.escapeHtml(card.example_from_story)}</p></div>` : ''}
            ${card.indian_context_example ? `<div style="margin-top:6px;"><span class="vocab-example-label">Example</span><p class="vocab-example">${this.escapeHtml(card.indian_context_example)}</p></div>` : ''}
            ${card.spot_it ? `<div class="spot-it-cta" data-open-spot-it="${this.escapeAttr(card.id)}">${spotAnswered ? '✓ Spot it answered' : '🎯 Spot it! Tap to test yourself'}</div>` : ''}
          </div>
        </div>
      </div>
    `;
  },

  renderSpotItModal() {
    const cardId = this.state.spotItModal;
    let card = null;
    for (const branch of this.data.stage_1_learn.branches) {
      if (branch.cards) { card = branch.cards.find(c => c.id === cardId); if (card) break; }
    }
    if (!card || !card.spot_it) return '';
    const ans = this.state.spotItAnswers[card.id];
    const spot = card.spot_it;
    const isAnswered = ans !== undefined;
    return `
      <div class="modal-overlay" data-close-modal="1">
        <div class="modal-content" data-stop-propagation="1">
          <div class="modal-title">Spot it: <span class="modal-word">${this.escapeHtml(card.word)}</span></div>
          <p style="margin:12px 0 16px 0;color:var(--ink-soft);font-size:14px;">${this.escapeHtml(spot.question)}</p>
          <ul class="options-list">${spot.options.map((opt, i) => {
            let cls = 'option-btn';
            if (isAnswered) {
              if (i === spot.correct) cls += ' correct';
              else if (i === ans.selected) cls += ' incorrect';
            }
            return `<li><button class="${cls}" data-spot-answer="${this.escapeAttr(card.id)}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
              <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
            </button></li>`;
          }).join('')}</ul>
          ${isAnswered ? `
            <div class="feedback-box explanation" style="margin-bottom:12px;">
              <span class="feedback-label">${ans.selected === spot.correct ? '✓ Correct!' : 'Not quite — see the right answer above'}</span>
            </div>
            <button class="btn btn-primary" data-close-modal="1" style="width:100%;">Continue</button>
          ` : ''}
        </div>
      </div>
    `;
  },

  renderStage2() {
    if (!this.isStageUnlocked(2)) {
      return `
        <div class="placeholder-card">
          <div class="placeholder-icon">🔒</div>
          <div class="placeholder-title">Complete Stage 1 First</div>
          <p class="placeholder-detail">Finish all three branches in Learn before moving to Practice.</p>
        </div>
        ${this.renderStageNav()}
      `;
    }
    const s = this.data.stage_2_practice;
    if (this.currentSection) {
      const section = s.sections.find(sec => sec.id === this.currentSection);
      if (section) return this.renderPracticeSectionView(section);
    }
    return `
      <div class="stage-header">
        <h2 class="stage-title">${this.escapeHtml(s.title)}</h2>
        <p class="stage-description">${this.escapeHtml(s.description)}</p>
      </div>
      <div class="branches-grid">${s.sections.map(sec => {
        const complete = this.isPracticeSectionComplete(sec);
        const total = sec.questions.length;
        const done = sec.questions.filter(q => this.state.practiceAnswers[q.id] && this.state.practiceAnswers[q.id].selected !== undefined).length;
        // 1 ⭐ per correct answer
        const correct = sec.questions.filter(q => {
          const a = this.state.practiceAnswers[q.id];
          return a && a.selected === q.correct;
        }).length;
        return `<div class="branch-card ${complete ? 'complete' : ''}" data-enter-section="${this.escapeAttr(sec.id)}">
          <div class="branch-icon">${sec.icon || '📑'}</div>
          <div class="branch-title">${this.escapeHtml(sec.title)}</div>
          <div class="branch-meta stars-meta">⭐ ${correct} / ${total} stars</div>
          <div class="branch-progress">${done} / ${total} done</div>
        </div>`;
      }).join('')}</div>
      ${this.renderStarsInfoCard(2)}
      ${this.renderStageNav()}
    `;
  },

  renderPracticeSectionView(section) {
    return `
      <div class="stage-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-back-to-sections="1">← Back</button>
        <div>
          <h2 class="stage-title" style="font-size:22px;margin:0;">${this.escapeHtml(section.title)}</h2>
          <p class="stage-description" style="font-size:13px;">${section.questions.length} questions · ⭐ ${section.marks} stars to earn</p>
        </div>
      </div>
      ${section.questions.map((q, i) => this.renderPracticeQuestion(q, i + 1)).join('')}
      <div class="stage-nav">
        <div></div>
        <button class="btn ${this.isPracticeSectionComplete(section) ? 'btn-success' : 'btn-secondary'}" data-back-to-sections="1">${this.isPracticeSectionComplete(section) ? '✓ Section Complete · Back' : 'Save & Back'}</button>
      </div>
    `;
  },

  renderPracticeQuestion(q, num) {
    const ans = this.state.practiceAnswers[q.id] || {};
    const isAnswered = ans.selected !== undefined;
    return `
      <div class="question-card">
        <div>
          <span class="question-number">${num}</span>
          ${q.category ? `<span style="display:inline-block;margin-left:10px;padding:4px 12px;background:var(--paper-dark);border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);vertical-align:middle;">${this.escapeHtml(q.category)}</span>` : ''}
        </div>
        ${q.passage_excerpt ? `<div class="passage-excerpt">${this.escapeHtml(q.passage_excerpt)}</div>` : ''}
        <p class="question-text">${this.escapeHtml(q.question)}</p>
        <ul class="options-list">${q.options.map((opt, i) => {
          let cls = 'option-btn';
          if (isAnswered) {
            if (i === q.correct) cls += ' correct';
            else if (i === ans.selected) cls += ' incorrect';
          }
          return `<li><button class="${cls}" data-practice-answer="${this.escapeAttr(q.id)}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
            <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
          </button></li>`;
        }).join('')}</ul>
        ${!isAnswered && q.hint ? `<div class="question-actions"><button class="btn btn-secondary" data-show-hint="${this.escapeAttr(q.id)}">💡 Show hint</button></div>` : ''}
        ${ans.showHint && q.hint ? `<div class="feedback-box hint"><span class="feedback-label">Hint</span>${this.escapeHtml(q.hint)}</div>` : ''}
        ${isAnswered && q.explanation ? `<div class="feedback-box explanation"><span class="feedback-label">${ans.selected === q.correct ? '✓ Correct!' : "Let's understand"}</span>${this.escapeHtml(q.explanation)}</div>` : ''}
      </div>
    `;
  },

  // ============================================================
  // STAGE 3: THINK DEEPER
  // ============================================================
  renderStage3() {
    if (!this.isStageUnlocked(3)) {
      return `
        <div class="placeholder-card">
          <div class="placeholder-icon">🔒</div>
          <div class="placeholder-title">Complete Practice First</div>
          <p class="placeholder-detail">Finish all of Practice before unlocking Think Deeper.</p>
        </div>
        ${this.renderStageNav()}
      `;
    }
    const s = this.data.stage_3_think;
    const submittedCount = s.problems.filter(p => this.state.thinkSubmissions[p.id] && this.state.thinkSubmissions[p.id].submitted).length;

    return `
      <div class="stage-header">
        <h2 class="stage-title">${this.escapeHtml(s.title)}</h2>
        <p class="stage-description">${this.escapeHtml(s.description)} · <strong>${submittedCount}/${s.problems.length} submitted</strong></p>
      </div>
      ${s.problems.map((p, i) => this.renderThinkProblem(p, i + 1)).join('')}
      ${this.renderStarsInfoCard(3)}
      ${this.renderStageNav()}
    `;
  },

  renderThinkProblem(p, num) {
    const sub = this.state.thinkSubmissions[p.id] || {};
    const isSubmitted = !!sub.submitted;
    const userAnswer = sub.value || '';
    const wordCount = this.countWords(userAnswer);
    const wordCounterClass = this.wordCounterClass(wordCount, p.word_limit);
    const hasSelfEval = p.type === 'subjective_self_eval' && Array.isArray(p.self_check_criteria) && p.self_check_criteria.length > 0;

    return `
      <div class="think-card ${isSubmitted ? 'submitted' : ''}" data-think-id="${this.escapeAttr(p.id)}">
        <div>
          <span class="question-number">${num}</span>
          ${p.category ? `<span class="question-category">${this.escapeHtml(p.category)}</span>` : ''}
          <span class="marks-tag stars-tag">⭐ 5</span>
          ${isSubmitted ? `<span class="submitted-tag">✓ Submitted</span>` : ''}
        </div>
        ${p.scenario ? `<div class="scenario-box">${this.escapeHtml(p.scenario)}</div>` : ''}
        <p class="question-text">${this.escapeHtml(p.question)}</p>
        ${p.word_limit ? `<div class="word-limit-tag">📝 Word limit: ${this.escapeHtml(p.word_limit)}</div>` : ''}
        <textarea
          class="text-input"
          rows="5"
          placeholder="Write your answer here..."
          data-think-input="${this.escapeAttr(p.id)}"
          ${isSubmitted ? 'readonly' : ''}>${this.escapeHtml(userAnswer)}</textarea>
        <div class="word-counter ${wordCounterClass}" data-counter-for="${this.escapeAttr(p.id)}">
          ${wordCount} word${wordCount === 1 ? '' : 's'}${p.word_limit ? ` · target: ${this.escapeHtml(p.word_limit)}` : ''}
        </div>
        <div class="question-actions">
          ${!isSubmitted
            ? `<button class="btn btn-success" data-think-submit="${this.escapeAttr(p.id)}">✓ Submit Answer</button>`
            : `<button class="btn btn-secondary" data-think-edit="${this.escapeAttr(p.id)}">✎ Edit Answer</button>`}
        </div>
        ${isSubmitted && hasSelfEval ? this.renderSelfCheckPanel(p, p.marks, { interactive: true, unit: 'stars' }) : ''}
        ${isSubmitted ? `
          <details class="model-answer-accordion">
            <summary>▶ See model answer & explanation</summary>
            <div class="model-answer-box">
              <span class="feedback-label">Model answer</span>
              <p class="answer-text">${this.escapeHtml(p.model_answer || '')}</p>
              ${p.explanation ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-dark);">
                  <span class="feedback-label" style="color: var(--leaf);">Why this works</span>
                  <p class="answer-text">${this.escapeHtml(p.explanation)}</p>
                </div>
              ` : ''}
              ${p.marking_guide_for_parent ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-dark);">
                  <span class="feedback-label" style="color: var(--berry);">For parent</span>
                  <p class="answer-text" style="font-size:13px;font-style:italic;">${this.escapeHtml(p.marking_guide_for_parent)}</p>
                </div>
              ` : ''}
            </div>
          </details>
        ` : ''}
      </div>
    `;
  },

  countWords(s) {
    if (!s || !s.trim()) return 0;
    return s.trim().split(/\s+/).length;
  },
