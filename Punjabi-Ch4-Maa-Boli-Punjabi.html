  renderBrandBar() {
    return `
      <div class="brand-bar">
        <img class="brand-logo" src="${this.LOGO_SRC}" alt="e-Gurukul by Levelup5Tutor">
        <div class="brand-tagline">Home Learning Studio</div>
      </div>`;
  },

  renderHeader() {
    const d = this.data;
    let title = d.chapter_title;
    if (d.chapter_number) title = `Chapter ${d.chapter_number} — ${title}`;
    const books = Array.isArray(d.books) ? d.books.join(' + ') : (d.book || '');
    const themeShort = d.theme_short || (d.theme ? d.theme.split(',')[0].trim() : '');
    return `
      <header class="app-header">
        <div class="header-eyebrow">${this.escapeHtml(d.subject || '')} · Class 5</div>
        <h1 class="header-title">${this.escapeHtml(title)}</h1>
        ${d.chapter_author ? `<div class="header-author">by ${this.escapeHtml(d.chapter_author)}</div>` : ''}
        ${themeShort ? `<div class="header-theme-pill">Theme — ${this.escapeHtml(themeShort)}</div>` : ''}
        ${books ? `<div class="header-meta">${this.escapeHtml(books)}</div>` : ''}
        <button class="reset-btn" data-reset-progress="1" title="Clear all progress and start fresh">↻ Reset</button>
      </header>
    `;
  },

  renderProgressBar() {
    const stages = [{num:1,label:'Learn'},{num:2,label:'Practice'},{num:3,label:'Think'},{num:4,label:'Test'}];
    return `<div class="progress-bar">${stages.map(s => {
      const isActive = this.currentStage === s.num;
      const isComplete = this.isStageComplete(s.num);
      const isLocked = !this.isStageUnlocked(s.num) && !isActive;
      let cls = '';
      if (isActive) cls = 'active';
      else if (isComplete) cls = 'complete';
      else if (isLocked) cls = 'locked';
      return `<div class="progress-step ${cls}" data-stage="${s.num}"><span class="step-num">${s.num}</span><span>${s.label}</span></div>`;
    }).join('')}</div>`;
  },

  renderDDBanner() {
    const dd = this.data.stage_0_deep_dive;
    if (!dd) return '';
    return `
      <div class="dd-banner ${this.currentStage === 0 ? 'open' : ''}" data-dd-banner="1">
        <div class="dd-banner-icon">📚</div>
        <div>
          <div class="dd-banner-title">Deep Dive — ${this.escapeHtml((dd.title || '').replace(/^Deep Dive\s*—\s*/i, ''))}</div>
          <div class="dd-banner-sub">${this.escapeHtml(dd.description || '')} Explore here anytime — it never affects your stars.</div>
        </div>
      </div>`;
  },

  ddMd(text) {
    // markdown-lite: escape first, then **bold**, *italic*, double-newline paragraphs
    const esc = this.escapeHtml(text || '');
    const inline = esc
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
    return inline.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  },

  renderStage0() {
    const dd = this.data.stage_0_deep_dive;
    if (!dd) return '';
    if (this.currentDDTopic) {
      const topic = dd.topics.find(t => t.id === this.currentDDTopic);
      if (topic) return this.renderDDTopic(topic);
    }
    return `
      <div class="stage-header">
        <h2 class="stage-title">🔎 ${this.escapeHtml(dd.title)}</h2>
        <p class="stage-description">${this.escapeHtml(dd.description || '')}</p>
      </div>
      <div class="branches-grid">${dd.topics.map(t => `
        <div class="branch-card" data-dd-topic="${t.id}">
          <div class="branch-icon">${t.icon || '📚'}</div>
          <div class="branch-title">${this.escapeHtml(t.title)}</div>
          <div class="dd-topic-sub">${this.escapeHtml(t.subtitle || '')}</div>
        </div>`).join('')}
      </div>
    `;
  },

  renderDDTopic(topic) {
    const sections = (topic.sections || []).map((s, si) => {
      if (s.type === 'interactive') {
        // Queue the section's JS to run after innerHTML is committed.
        // (Scripts inserted via innerHTML never execute on their own.)
        if (s.js) this._pendingScripts.push({ key: topic.id + '_' + si, code: s.js });
        return `<div class="dd-section dd-interactive">
          <h3>🧩 ${this.escapeHtml(s.title || 'Try it')}</h3>
          <div class="dd-interactive-body">${s.html || ''}</div>
        </div>`;
      }
      if (s.type === 'story') {
        return `<div class="dd-section dd-story">
          <h3>📖 ${this.escapeHtml(s.title)}</h3>
          ${s.audio ? `<div class="dd-audio">
            <span class="dd-audio-label">🎧 ਸੁਣੋ · Listen</span>
            <audio class="dd-audio-player" controls preload="none" src="${s.audio}">
              ਤੁਹਾਡਾ ਬ੍ਰਾਊਜ਼ਰ ਆਡੀਓ ਸਪੋਰਟ ਨਹੀਂ ਕਰਦਾ।
            </audio>
          </div>` : ''}
          ${this.ddMd(s.content)}
          ${s.image_svg ? `<div class="dd-figure">${s.image_svg}</div>` : ''}
          ${s.image_caption ? `<div class="dd-caption">${this.escapeHtml(s.image_caption)}</div>` : ''}
        </div>`;
      }
      if (s.type === 'steps') {
        return `<div class="dd-section">
          <h3>🪜 ${this.escapeHtml(s.title)}</h3>
          ${(s.steps || []).map((st, i) => `
            <div class="dd-step">
              <div class="dd-step-num">${i + 1}</div>
              <div class="dd-step-body">
                <div class="dd-step-title">${this.escapeHtml(st.title)}</div>
                <div>${this.ddMd(st.text)}</div>
                ${st.example ? `<div class="dd-step-example"><strong>e.g.</strong> ${this.ddMd(st.example)}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>`;
      }
      if (s.type === 'tip') {
        return `<div class="dd-callout tip"><h3>💡 ${this.escapeHtml(s.title)}</h3>${this.ddMd(s.content)}</div>`;
      }
      if (s.type === 'funfact') {
        return `<div class="dd-callout funfact"><h3>🤔 ${this.escapeHtml(s.title)}</h3>${this.ddMd(s.content)}</div>`;
      }
      return '';
    }).join('');
    const topics = this.data.stage_0_deep_dive.topics;
    const idx = topics.findIndex(t => t.id === topic.id);
    const prev = idx > 0 ? topics[idx - 1] : null;
    const next = idx < topics.length - 1 ? topics[idx + 1] : null;
    return `
      <div class="stage-header">
        <h2 class="stage-title">${topic.icon || ''} ${this.escapeHtml(topic.title)}</h2>
        <p class="stage-description">${this.escapeHtml(topic.subtitle || '')}</p>
      </div>
      ${sections}
      <div class="dd-topic-nav">
        ${prev ? `<button class="btn btn-secondary" data-dd-topic="${prev.id}">← Previous Topic</button>` : '<div></div>'}
        ${next ? `<button class="btn btn-primary" data-dd-topic="${next.id}">Next Topic →</button>` : '<div></div>'}
      </div>
    `;
  },

  renderStage1() {
    const s = this.data.stage_1_learn;
    if (this.currentBranch) {
      const branch = s.branches.find(b => b.id === this.currentBranch);
      if (branch) {
        if (branch.type === 'story_panels') return this.renderStoryPanelView(branch);
        if (branch.type === 'vocabulary_cards') return this.renderVocabCardsView(branch);
      }
    }
    return `
      <div class="stage-header">
        <h2 class="stage-title">${this.escapeHtml(s.title)}</h2>
        <p class="stage-description">${this.escapeHtml(s.description)}</p>
      </div>
      <div class="branches-grid">${s.branches.map(b => {
        const complete = this.isBranchComplete(b);
        let progress = '';
        let starsEarned = 0, starsPossible = 0;
        if (b.type === 'story_panels') {
          const total = b.panels.length;
          const done = b.panels.filter(p => !p.comprehension_check || (this.state.panelChecks[p.id] && this.state.panelChecks[p.id].selected !== undefined)).length;
          progress = `${done} / ${total} panels`;
          // 1 ⭐ per correct comprehension check
          b.panels.forEach(p => {
            if (p.comprehension_check) {
              starsPossible += 1;
              const a = this.state.panelChecks[p.id];
              if (a && a.selected === p.comprehension_check.correct) starsEarned += 1;
            }
          });
        } else if (b.type === 'vocabulary_cards') {
          const total = b.cards.length;
          const done = b.cards.filter(c => this.state.spotItAnswers[c.id] !== undefined).length;
          progress = `${done} / ${total} words`;
          // 1 ⭐ per correct spot-it
          b.cards.forEach(c => {
            if (c.spot_it) {
              starsPossible += 1;
              const a = this.state.spotItAnswers[c.id];
              if (a && a.correct) starsEarned += 1;
            }
          });
        }
        return `<div class="branch-card ${complete ? 'complete' : ''}" data-enter-branch="${this.escapeAttr(b.id)}">
          <div class="branch-icon">${b.icon || '📖'}</div>
          <div class="branch-title">${this.escapeHtml(b.title)}</div>
          <div class="branch-meta stars-meta">⭐ ${starsEarned} / ${starsPossible} stars</div>
          <div class="branch-progress">${progress}</div>
        </div>`;
      }).join('')}</div>
      ${this.renderStarsInfoCard(1)}
      ${this.renderStageNav()}
    `;
  },

  renderStoryPanelView(branch) {
    const idx = this.currentPanelIdx;
    const panel = branch.panels[idx];
    const total = branch.panels.length;
    const check = this.state.panelChecks[panel.id] || {};
    const isAnswered = check.selected !== undefined;

    return `
      <div class="stage-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-back-to-branches="1">← Back</button>
        <div>
          <h2 class="stage-title" style="font-size:22px;margin:0;">${this.escapeHtml(branch.title)}</h2>
          <p class="stage-description" style="font-size:13px;">${this.escapeHtml(branch.story_title || '')}${branch.story_author ? ' · by ' + this.escapeHtml(branch.story_author) : ''}</p>
        </div>
      </div>
      <div class="panel-dots">
        ${branch.panels.map((p, i) => {
          const answered = !p.comprehension_check || (this.state.panelChecks[p.id] && this.state.panelChecks[p.id].selected !== undefined);
          const isCurrent = i === idx;
          let cls = 'panel-dot';
          if (isCurrent) cls += ' current';
          if (answered) cls += ' answered';
          return `<button class="${cls}" data-jump-to-panel="${i}" title="Panel ${i+1}: ${this.escapeAttr(p.panel_title)}">${i+1}${answered ? ' ✓' : ''}</button>`;
        }).join('')}
      </div>
      <div class="panel-container">
        <div class="panel-meta">
          <span class="panel-counter">Panel ${idx + 1} of ${total}</span>
          <span style="font-size:11px;color:var(--ink-soft);font-weight:700;">${this.countAnsweredPanels(branch)} of ${total} checks answered</span>
        </div>
        <h3 class="panel-title">${this.escapeHtml(panel.panel_title)}</h3>
        <div class="narration-text">${this.renderNarrationWithHighlights(panel)}</div>
        ${panel.comprehension_check ? this.renderComprehensionCheck(panel) : ''}
      </div>
      <div class="panel-nav">
        ${idx > 0 ? `<button class="btn btn-secondary" data-panel-nav="prev">← Previous Panel</button>` : `<button class="btn btn-secondary" disabled>← Previous Panel</button>`}
        ${idx < total - 1
          ? `<button class="btn btn-primary" data-panel-nav="next" ${panel.comprehension_check && !isAnswered ? 'disabled' : ''}>Next Panel →</button>`
          : `<button class="btn btn-success" data-panel-nav="finish-branch" ${!this.isBranchComplete(branch) ? 'disabled' : ''}>${this.isBranchComplete(branch) ? '✓ Finish ' + this.escapeHtml(branch.title) : 'Answer all panels to finish'}</button>`}
      </div>
    `;
  },

  renderNarrationWithHighlights(panel) {
    let text = panel.narration_text;
    if (panel.highlighted_words && panel.highlighted_words.length > 0) {
      const sorted = [...panel.highlighted_words].sort((a, b) => b.word.length - a.word.length);
      sorted.forEach((hw) => {
        const escaped = hw.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b(${escaped})\\b`, 'gi');
        const dataIdx = panel.highlighted_words.indexOf(hw);
        text = text.replace(regex, (match) => `<span class="highlight-word" data-word-idx="${dataIdx}" data-panel-id="${this.escapeAttr(panel.id)}">${match}</span>`);
      });
    }
    return text;
  },

  renderComprehensionCheck(panel) {
    const check = panel.comprehension_check;
    const ans = this.state.panelChecks[panel.id] || {};
    const isAnswered = ans.selected !== undefined;
    return `
      <div class="comprehension-check">
        <span class="check-label">Quick Check${check.marks ? ' · ⭐ ' + check.marks : ''}</span>
        <p class="check-question">${this.escapeHtml(check.question)}</p>
        <ul class="options-list">${check.options.map((opt, i) => {
          let cls = 'option-btn';
          if (isAnswered) {
            if (i === check.correct) cls += ' correct';
            else if (i === ans.selected) cls += ' incorrect';
          }
          return `<li><button class="${cls}" data-panel-check="${this.escapeAttr(panel.id)}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
            <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
          </button></li>`;
        }).join('')}</ul>
        ${isAnswered && check.explanation ? `
          <div class="feedback-box explanation">
            <span class="feedback-label">${ans.selected === check.correct ? '✓ Correct!' : "Let's understand"}</span>
            ${this.escapeHtml(check.explanation)}
          </div>` : ''}
      </div>
    `;
  },

  renderVocabCardsView(branch) {
    // Group cards by source for cleaner browsing
    const groups = {};
    branch.cards.forEach(c => {
      const src = c.source || 'Words';
      if (!groups[src]) groups[src] = [];
      groups[src].push(c);
    });

    // If we don't have a sub-view selected, default to first group
    const sources = Object.keys(groups);
    if (!this.currentVocabGroup || !groups[this.currentVocabGroup]) {
      this.currentVocabGroup = sources[0];
    }
    const activeCards = groups[this.currentVocabGroup] || [];

    // Group completion stats
    const groupTabs = sources.map(src => {
      const cards = groups[src];
      const done = cards.filter(c => this.state.spotItAnswers[c.id] !== undefined).length;
      const isActive = src === this.currentVocabGroup;
      const isComplete = done === cards.length;
      return `<button class="vocab-group-tab ${isActive ? 'active' : ''} ${isComplete ? 'complete' : ''}" data-vocab-group="${this.escapeAttr(src)}">
        ${this.escapeHtml(src)} <span style="opacity:0.7;font-size:11px;">(${done}/${cards.length})${isComplete ? ' ✓' : ''}</span>
      </button>`;
    }).join('');

    // Decide bottom-right button:
    //  - If current tab is complete AND another tab is incomplete → "Next: [tab] →"
    //  - Else if all tabs complete → "✓ Branch Complete · Back"
    //  - Else → "Save & Back"
    const currentTabDone = activeCards.every(c => this.state.spotItAnswers[c.id] !== undefined);
    const allTabsDone = this.isBranchComplete(branch);
    let nextIncompleteTab = null;
    if (currentTabDone && !allTabsDone) {
      for (const src of sources) {
        if (src === this.currentVocabGroup) continue;
        const cards = groups[src];
        const allDone = cards.every(c => this.state.spotItAnswers[c.id] !== undefined);
        if (!allDone) { nextIncompleteTab = src; break; }
      }
    }

    let bottomBtn;
    if (nextIncompleteTab) {
      bottomBtn = `<button class="btn btn-primary" data-vocab-group="${this.escapeAttr(nextIncompleteTab)}">Next: ${this.escapeHtml(nextIncompleteTab)} →</button>`;
    } else if (allTabsDone) {
      bottomBtn = `<button class="btn btn-success" data-back-to-branches="1">✓ Branch Complete · Back</button>`;
    } else {
      bottomBtn = `<button class="btn btn-secondary" data-back-to-branches="1">Save & Back</button>`;
    }

    return `
      <div class="stage-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-back-to-branches="1">← Back</button>
        <div>
          <h2 class="stage-title" style="font-size:22px;margin:0;">${this.escapeHtml(branch.title)}</h2>
          <p class="stage-description" style="font-size:13px;">Tap each card to see meaning, then test yourself with "Spot it!"</p>
        </div>
      </div>
      <div class="vocab-group-tabs">${groupTabs}</div>
      <div class="cards-grid">${activeCards.map(c => this.renderVocabCard(c)).join('')}</div>
      <div class="stage-nav">
        <div></div>
        ${bottomBtn}
      </div>
    `;
  },

  renderVocabCard(card) {
    const flipped = this.state.cardFlips[card.id];
    const spotAnswered = this.state.spotItAnswers[card.id] !== undefined;
    return `
      <div class="vocab-card ${flipped ? 'flipped' : ''} ${spotAnswered ? 'complete' : ''}" data-flip-card="${this.escapeAttr(card.id)}">
        <div class="vocab-card-inner">
          <div class="vocab-face front">
            <div class="vocab-source-tag">${this.escapeHtml(card.source || 'Word')}</div>
            <div class="vocab-word">${this.escapeHtml(card.word)}</div>
            <div class="vocab-flip-hint">Tap to reveal</div>
          </div>
          <div class="vocab-face back">
            <div class="vocab-meaning">${this.escapeHtml(card.meaning)}</div>
            ${card.example_from_story ? `<div><span class="vocab-example-label">From the story</span><p class="vocab-example">${this.escapeHtml(card.example_from_story)}</p></div>` : ''}
            ${card.indian_context_example ? `<div style="margin-top:6px;"><span class="vocab-example-label">Example</span><p class="vocab-example">${this.escapeHtml(card.indian_context_example)}</p></div>` : ''}
            ${card.spot_it ? `<div class="spot-it-cta" data-open-spot-it="${this.escapeAttr(card.id)}">${spotAnswered ? '✓ Spot it answered' : '🎯 Spot it! Tap to test yourself'}</div>` : ''}
          </div>
        </div>
      </div>
    `;
  },

  renderSpotItModal() {
    const cardId = this.state.spotItModal;
    let card = null;
    for (const branch of this.data.stage_1_learn.branches) {
      if (branch.cards) { card = branch.cards.find(c => c.id === cardId); if (card) break; }
    }
    if (!card || !card.spot_it) return '';
    const ans = this.state.spotItAnswers[card.id];
    const spot = card.spot_it;
    const isAnswered = ans !== undefined;
    return `
      <div class="modal-overlay" data-close-modal="1">
        <div class="modal-content" data-stop-propagation="1">
          <div class="modal-title">Spot it: <span class="modal-word">${this.escapeHtml(card.word)}</span></div>
          <p style="margin:12px 0 16px 0;color:var(--ink-soft);font-size:14px;">${this.escapeHtml(spot.question)}</p>
          <ul class="options-list">${spot.options.map((opt, i) => {
            let cls = 'option-btn';
            if (isAnswered) {
              if (i === spot.correct) cls += ' correct';
              else if (i === ans.selected) cls += ' incorrect';
            }
            return `<li><button class="${cls}" data-spot-answer="${this.escapeAttr(card.id)}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
              <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
            </button></li>`;
          }).join('')}</ul>
          ${isAnswered ? `
            <div class="feedback-box explanation" style="margin-bottom:12px;">
              <span class="feedback-label">${ans.selected === spot.correct ? '✓ Correct!' : 'Not quite — see the right answer above'}</span>
            </div>
            <button class="btn btn-primary" data-close-modal="1" style="width:100%;">Continue</button>
          ` : ''}
        </div>
      </div>
    `;
  },

  renderStage2() {
    if (!this.isStageUnlocked(2)) {
      return `
        <div class="placeholder-card">
          <div class="placeholder-icon">🔒</div>
          <div class="placeholder-title">Complete Stage 1 First</div>
          <p class="placeholder-detail">Finish all three branches in Learn before moving to Practice.</p>
        </div>
        ${this.renderStageNav()}
      `;
    }
    const s = this.data.stage_2_practice;
    if (this.currentSection) {
      const section = s.sections.find(sec => sec.id === this.currentSection);
      if (section) return this.renderPracticeSectionView(section);
    }
    return `
      <div class="stage-header">
        <h2 class="stage-title">${this.escapeHtml(s.title)}</h2>
        <p class="stage-description">${this.escapeHtml(s.description)}</p>
      </div>
      <div class="branches-grid">${s.sections.map(sec => {
        const complete = this.isPracticeSectionComplete(sec);
        const total = sec.questions.length;
        const done = sec.questions.filter(q => this.state.practiceAnswers[q.id] && this.state.practiceAnswers[q.id].selected !== undefined).length;
        // 1 ⭐ per correct answer
        const correct = sec.questions.filter(q => {
          const a = this.state.practiceAnswers[q.id];
          return a && a.selected === q.correct;
        }).length;
        return `<div class="branch-card ${complete ? 'complete' : ''}" data-enter-section="${this.escapeAttr(sec.id)}">
          <div class="branch-icon">${sec.icon || '📑'}</div>
          <div class="branch-title">${this.escapeHtml(sec.title)}</div>
          <div class="branch-meta stars-meta">⭐ ${correct} / ${total} stars</div>
          <div class="branch-progress">${done} / ${total} done</div>
        </div>`;
      }).join('')}</div>
      ${this.renderStarsInfoCard(2)}
      ${this.renderStageNav()}
    `;
  },

  renderPracticeSectionView(section) {
    return `
      <div class="stage-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-secondary" data-back-to-sections="1">← Back</button>
        <div>
          <h2 class="stage-title" style="font-size:22px;margin:0;">${this.escapeHtml(section.title)}</h2>
          <p class="stage-description" style="font-size:13px;">${section.questions.length} questions · ⭐ ${section.marks} stars to earn</p>
        </div>
      </div>
      ${section.questions.map((q, i) => this.renderPracticeQuestion(q, i + 1)).join('')}
      <div class="stage-nav">
        <div></div>
        <button class="btn ${this.isPracticeSectionComplete(section) ? 'btn-success' : 'btn-secondary'}" data-back-to-sections="1">${this.isPracticeSectionComplete(section) ? '✓ Section Complete · Back' : 'Save & Back'}</button>
      </div>
    `;
  },

  renderPracticeQuestion(q, num) {
    const ans = this.state.practiceAnswers[q.id] || {};
    const isAnswered = ans.selected !== undefined;
    return `
      <div class="question-card">
        <div>
          <span class="question-number">${num}</span>
          ${q.category ? `<span style="display:inline-block;margin-left:10px;padding:4px 12px;background:var(--paper-dark);border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);vertical-align:middle;">${this.escapeHtml(q.category)}</span>` : ''}
        </div>
        ${q.passage_excerpt ? `<div class="passage-excerpt">${this.escapeHtml(q.passage_excerpt)}</div>` : ''}
        <p class="question-text">${this.escapeHtml(q.question)}</p>
        <ul class="options-list">${q.options.map((opt, i) => {
          let cls = 'option-btn';
          if (isAnswered) {
            if (i === q.correct) cls += ' correct';
            else if (i === ans.selected) cls += ' incorrect';
          }
          return `<li><button class="${cls}" data-practice-answer="${this.escapeAttr(q.id)}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
            <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
          </button></li>`;
        }).join('')}</ul>
        ${!isAnswered && q.hint ? `<div class="question-actions"><button class="btn btn-secondary" data-show-hint="${this.escapeAttr(q.id)}">💡 Show hint</button></div>` : ''}
        ${ans.showHint && q.hint ? `<div class="feedback-box hint"><span class="feedback-label">Hint</span>${this.escapeHtml(q.hint)}</div>` : ''}
        ${isAnswered && q.explanation ? `<div class="feedback-box explanation"><span class="feedback-label">${ans.selected === q.correct ? '✓ Correct!' : "Let's understand"}</span>${this.escapeHtml(q.explanation)}</div>` : ''}
      </div>
    `;
  },

  // ============================================================
  // STAGE 3: THINK DEEPER
  // ============================================================
  renderStage3() {
    if (!this.isStageUnlocked(3)) {
      return `
        <div class="placeholder-card">
          <div class="placeholder-icon">🔒</div>
          <div class="placeholder-title">Complete Practice First</div>
          <p class="placeholder-detail">Finish all of Practice before unlocking Think Deeper.</p>
        </div>
        ${this.renderStageNav()}
      `;
    }
    const s = this.data.stage_3_think;
    const submittedCount = s.problems.filter(p => this.state.thinkSubmissions[p.id] && this.state.thinkSubmissions[p.id].submitted).length;

    return `
      <div class="stage-header">
        <h2 class="stage-title">${this.escapeHtml(s.title)}</h2>
        <p class="stage-description">${this.escapeHtml(s.description)} · <strong>${submittedCount}/${s.problems.length} submitted</strong></p>
      </div>
      ${s.problems.map((p, i) => this.renderThinkProblem(p, i + 1)).join('')}
      ${this.renderStarsInfoCard(3)}
      ${this.renderStageNav()}
    `;
  },

  renderThinkProblem(p, num) {
    const sub = this.state.thinkSubmissions[p.id] || {};
    const isSubmitted = !!sub.submitted;
    const userAnswer = sub.value || '';
    const wordCount = this.countWords(userAnswer);
    const wordCounterClass = this.wordCounterClass(wordCount, p.word_limit);
    const hasSelfEval = p.type === 'subjective_self_eval' && Array.isArray(p.self_check_criteria) && p.self_check_criteria.length > 0;

    return `
      <div class="think-card ${isSubmitted ? 'submitted' : ''}" data-think-id="${this.escapeAttr(p.id)}">
        <div>
          <span class="question-number">${num}</span>
          ${p.category ? `<span class="question-category">${this.escapeHtml(p.category)}</span>` : ''}
          <span class="marks-tag stars-tag">⭐ 5</span>
          ${isSubmitted ? `<span class="submitted-tag">✓ Submitted</span>` : ''}
        </div>
        ${p.scenario ? `<div class="scenario-box">${this.escapeHtml(p.scenario)}</div>` : ''}
        <p class="question-text">${this.escapeHtml(p.question)}</p>
        ${p.word_limit ? `<div class="word-limit-tag">📝 Word limit: ${this.escapeHtml(p.word_limit)}</div>` : ''}
        <textarea
          class="text-input"
          rows="5"
          placeholder="Write your answer here..."
          data-think-input="${this.escapeAttr(p.id)}"
          ${isSubmitted ? 'readonly' : ''}>${this.escapeHtml(userAnswer)}</textarea>
        <div class="word-counter ${wordCounterClass}" data-counter-for="${this.escapeAttr(p.id)}">
          ${wordCount} word${wordCount === 1 ? '' : 's'}${p.word_limit ? ` · target: ${this.escapeHtml(p.word_limit)}` : ''}
        </div>
        <div class="question-actions">
          ${!isSubmitted
            ? `<button class="btn btn-success" data-think-submit="${this.escapeAttr(p.id)}">✓ Submit Answer</button>`
            : `<button class="btn btn-secondary" data-think-edit="${this.escapeAttr(p.id)}">✎ Edit Answer</button>`}
        </div>
        ${isSubmitted && hasSelfEval ? this.renderSelfCheckPanel(p, p.marks, { interactive: true, unit: 'stars' }) : ''}
        ${isSubmitted ? `
          <details class="model-answer-accordion">
            <summary>▶ See model answer & explanation</summary>
            <div class="model-answer-box">
              <span class="feedback-label">Model answer</span>
              <p class="answer-text">${this.escapeHtml(p.model_answer || '')}</p>
              ${p.explanation ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-dark);">
                  <span class="feedback-label" style="color: var(--leaf);">Why this works</span>
                  <p class="answer-text">${this.escapeHtml(p.explanation)}</p>
                </div>
              ` : ''}
              ${p.marking_guide_for_parent ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-dark);">
                  <span class="feedback-label" style="color: var(--berry);">For parent</span>
                  <p class="answer-text" style="font-size:13px;font-style:italic;">${this.escapeHtml(p.marking_guide_for_parent)}</p>
                </div>
              ` : ''}
            </div>
          </details>
        ` : ''}
      </div>
    `;
  },

  countWords(s) {
    if (!s || !s.trim()) return 0;
    return s.trim().split(/\s+/).length;
  },

  wordCounterClass(count, limit) {
    if (!limit) return '';
    const m = limit.match(/(\d+)\s*[-–]\s*(\d+)/);
    if (!m) return '';
    const min = parseInt(m[1], 10), max = parseInt(m[2], 10);
    if (count >= min && count <= max) return 'in-range';
    if (count > max) return 'over';
    return '';
  },

  // Parse min/max words from word_limit string. Returns null if no limit.
  wordLimitRange(limit) {
    if (!limit) return null;
    const m = String(limit).match(/(\d+)\s*[-–]\s*(\d+)/);
    if (!m) return null;
    return { min: parseInt(m[1], 10), max: parseInt(m[2], 10) };
  },

  // Score a subjective_self_eval question.
  // Returns: { marks, source } where source is 'parent' | 'self_check' | 'engagement'
  // Logic:
  //   - If parent override exists and is a number, use it (clamped to 0..maxMarks).
  //   - Else: if no answer or no criteria, score by engagement (any answer = full marks; deferred to old logic).
  //   - Else: base = (ticked / total) × maxMarks, then halve if word count below minimum.
  scoreSubjectiveSelfEval(q, maxMarks) {
    const submission = this.state.thinkSubmissions[q.id] || this.state.testAnswers[q.id] || {};
    const answer = (submission.value || '').trim();
    const override = this.state.parentOverrides[q.id];

    // Parent override wins
    if (override !== undefined && override !== null && override !== '') {
      const n = parseFloat(override);
      if (!isNaN(n)) {
        return { marks: Math.max(0, Math.min(maxMarks, Math.round(n))), source: 'parent' };
      }
    }

    // No answer = 0
    if (!answer) return { marks: 0, source: 'no_answer' };

    // No criteria = engagement-based fallback (full marks for submitting, like old behavior)
    if (!q.self_check_criteria || !Array.isArray(q.self_check_criteria) || q.self_check_criteria.length === 0) {
      return { marks: maxMarks, source: 'engagement' };
    }

    // Self-check based scoring
    const ticks = this.state.selfCheckTicks[q.id] || [];
    const tickedCount = ticks.filter(t => t === true).length;
    const total = q.self_check_criteria.length;
    let base = total > 0 ? (tickedCount / total) * maxMarks : 0;

    // Word count gate: if below minimum, halve the score
    const range = this.wordLimitRange(q.word_limit);
    if (range) {
      const wc = this.countWords(answer);
      if (wc < range.min) base = base * 0.5;
    }

    return { marks: Math.round(base), source: 'self_check' };
  },

  // Render the self-check panel for a subjective_self_eval question.
  // showAfterSubmit: true for Stage 3 (interactive after submit). For Stage 4 results review, also true after testSubmitted.
  renderSelfCheckPanel(q, maxMarks, options) {
    options = options || {};
    const interactive = options.interactive !== false;  // default true
    const unit = options.unit || 'marks';                // 'marks' or 'stars'
    const unitIcon = unit === 'stars' ? '⭐ ' : '';
    const unitLabel = unit === 'stars' ? 'stars' : 'marks';
    const ticks = this.state.selfCheckTicks[q.id] || [];
    const override = this.state.parentOverrides[q.id];
    const overrideStr = override !== undefined && override !== null ? String(override) : '';
    // Stars (Stage 3) use the simple 1+4 formula. Marks (Stage 4) use the proportional formula.
    let score;
    if (unit === 'stars') {
      const stars = this.scoreThinkProblemStars(q);
      const isOverride = override !== undefined && override !== null && override !== '';
      score = { marks: stars, source: isOverride ? 'parent' : 'self_check' };
    } else {
      score = this.scoreSubjectiveSelfEval(q, maxMarks);
    }

    return `
      <div class="self-check-panel">
        <div class="self-check-header">
          <span class="self-check-title">📋 Self-Check</span>
          <span class="self-check-score ${score.source === 'parent' ? 'parent' : ''}">
            ${unitIcon}${score.marks} / ${unit === 'stars' ? 5 : maxMarks} ${unitLabel}
            ${score.source === 'parent' ? '· parent override' : (score.source === 'self_check' ? '· self-graded' : '')}
          </span>
        </div>
        <p class="self-check-instructions">Tick the boxes for what you actually included in your answer:</p>
        <ul class="self-check-list">
          ${q.self_check_criteria.map((c, i) => {
            const isTicked = ticks[i] === true;
            return `
              <li>
                <label class="self-check-item">
                  <input type="checkbox" ${interactive ? '' : 'disabled'} ${isTicked ? 'checked' : ''} data-self-check="${this.escapeAttr(q.id)}" data-idx="${i}">
                  <span class="self-check-text">${this.escapeHtml(c)}</span>
                </label>
              </li>
            `;
          }).join('')}
        </ul>
        ${(() => {
          const submission = this.state.thinkSubmissions[q.id] || this.state.testAnswers[q.id] || {};
          const answer = (submission.value || '').trim();
          const wc = this.countWords(answer);
          const range = this.wordLimitRange(q.word_limit);
          if (range && wc < range.min && answer) {
            if (unit === 'stars') {
              return `<div class="word-gate-warning">⚠️ Your answer (${wc} words) is below the minimum (${range.min} words). You'll miss the 1 ⭐ for word-limit. Write a fuller answer to earn it.</div>`;
            }
            return `<div class="word-gate-warning">⚠️ Your answer (${wc} words) is below the minimum (${range.min} words). Score is halved. Try writing a fuller answer for full ${unitLabel}.</div>`;
          }
          return '';
        })()}
        <div class="parent-override-row">
          <label class="parent-override-label">
            <span>✎ Parent Review</span>
            <input type="number" min="0" max="${unit === 'stars' ? 5 : maxMarks}" step="1" placeholder="—"
                   value="${this.escapeAttr(overrideStr)}"
                   data-parent-override="${this.escapeAttr(q.id)}"
                   data-max="${unit === 'stars' ? 5 : maxMarks}"
                   class="parent-override-input">
            <span class="parent-override-suffix">/ ${unit === 'stars' ? 5 : maxMarks}</span>
          </label>
          <span class="parent-override-hint">Parent: leave blank to use self-grade. Type a number to override.</span>
        </div>
      </div>
    `;
  },

  // ============================================================
  // STAGE 4: TEST
  // ============================================================
  renderStage4() {
    if (!this.isStageUnlocked(4)) {
      return `
        <div class="placeholder-card">
          <div class="placeholder-icon">🔒</div>
          <div class="placeholder-title">Complete Think Deeper First</div>
          <p class="placeholder-detail">Finish all five Think Deeper questions before taking the test.</p>
        </div>
        ${this.renderStageNav()}
      `;
    }
    if (this.state.testSubmitted) return this.renderResults();
    if (this.state.testStartTime === null) return this.renderTestIntro();
    return this.renderTestActive();
  },

  renderTestIntro() {
    const s = this.data.stage_4_test;
    const minutes = Math.floor((s.duration_seconds || 2400) / 60);
    const totalQuestions = s.sections.reduce((sum, sec) => sum + sec.questions.length, 0);

    return `
      <div class="test-intro">
        <div class="test-intro-icon">🏆</div>
        <h2>${this.escapeHtml(s.title)}</h2>
        <p class="test-intro-subtitle">${this.escapeHtml(s.subtitle || '')}</p>
        <div class="test-stats">
          <div class="test-stat">
            <div class="test-stat-num">${totalQuestions}</div>
            <div class="test-stat-label">Questions</div>
          </div>
          <div class="test-stat">
            <div class="test-stat-num">${s.total_marks}</div>
            <div class="test-stat-label">Marks</div>
          </div>
          <div class="test-stat">
            <div class="test-stat-num">${minutes}</div>
            <div class="test-stat-label">Minutes</div>
          </div>
        </div>
        <div class="test-sections-preview">
          ${s.sections.map(sec => `
            <div class="test-section-preview">
              <strong>${this.escapeHtml(sec.title)}</strong> · ${sec.marks} marks · ${sec.questions.length} questions
            </div>
          `).join('')}
        </div>
        <button class="test-start-btn" data-start-test="1">Start Test →</button>
      </div>
      ${this.renderStarsInfoCard(4)}
    `;
  },

  renderTestActive() {
    const s = this.data.stage_4_test;
    const elapsed = Math.floor((Date.now() - this.state.testStartTime) / 1000);
    const remaining = Math.max(0, (s.duration_seconds || 2400) - elapsed);
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    let timerClass = '';
    if (remaining < 60) timerClass = 'urgent';
    else if (remaining < 300) timerClass = 'warning';

    if (remaining === 0 && !this.state.testTimeUp) {
      this.state.testTimeUp = true;
      setTimeout(() => this.submitTest(), 100);
    }

    const totalQuestions = s.sections.reduce((sum, sec) => sum + sec.questions.length, 0);
    const answeredCount = Object.keys(this.state.testAnswers).filter(k => {
      const v = this.state.testAnswers[k];
      return v && v.value !== undefined && String(v.value).trim() !== '';
    }).length;

    return `
      <div class="timer-bar">
        <div class="timer-display ${timerClass}" id="timer-display">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
        <div class="timer-progress" id="timer-progress">${answeredCount} / ${totalQuestions} answered</div>
      </div>
      ${s.sections.map((sec, sidx) => this.renderTestSection(sec, sidx + 1)).join('')}
      <div class="test-submit-zone">
        <p style="margin-bottom: 12px; color: var(--ink-soft); font-size: 14px;">When you're done, submit your test.</p>
        <button class="btn btn-primary test-submit-btn" data-submit-test="1">Submit Test ✓</button>
      </div>
    `;
  },

  renderTestSection(section, sidx) {
    return `
      <div class="test-section">
        <div class="test-section-header">
          <h3>${this.escapeHtml(section.title)}</h3>
          <span class="test-section-marks">${section.marks} marks</span>
        </div>
        ${section.instructions ? `<p class="test-section-instructions">${this.escapeHtml(section.instructions)}</p>` : ''}
        ${section.passage ? this.renderTestPassage(section.passage) : ''}
        ${section.questions.map((q, i) => this.renderTestQuestion(q, sidx, i + 1)).join('')}
      </div>
    `;
  },

  renderTestPassage(passage) {
    // Hide the "e-Gurukul (AI generated)" author line and the parent review note from the student-facing UI.
    // The is_ai_generated flag remains in the JSON for the parent's reference when reviewing/editing chapters.
    const showAuthor = passage.author && !/(e-gurukul|ai[\s-]?generated)/i.test(passage.author);
    return `
      <div class="test-passage">
        <div class="test-passage-title">${this.escapeHtml(passage.title)}</div>
        ${showAuthor ? `<div class="test-passage-author">${this.escapeHtml(passage.author)}</div>` : ''}
        <div class="test-passage-text">${this.escapeHtml(passage.text)}</div>
      </div>
    `;
  },

  renderTestQuestion(q, sidx, qnum) {
    const ans = this.state.testAnswers[q.id] || {};
    const value = ans.value !== undefined ? String(ans.value) : '';

    let inputHtml = '';
    if (q.type === 'mcq') {
      inputHtml = `
        <ul class="options-list">
          ${q.options.map((opt, i) => {
            const selected = ans.value === opt;
            return `<li><button class="option-btn ${selected ? 'test-selected' : ''}" data-test-mcq="${this.escapeAttr(q.id)}" data-value="${this.escapeAttr(opt)}">
              <span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${this.escapeHtml(opt)}</span>
            </button></li>`;
          }).join('')}
        </ul>
      `;
    } else if (q.type === 'fill_blank') {
      inputHtml = `<input type="text" class="text-input" data-test-input="${this.escapeAttr(q.id)}" value="${this.escapeAttr(value)}" placeholder="Type your answer...">`;
    } else if (q.type === 'short_answer' || q.type === 'subjective' || q.type === 'subjective_self_eval') {
      const wlimit = q.word_limit || '';
      const wc = this.countWords(value);
      const wccls = this.wordCounterClass(wc, wlimit);
      inputHtml = `
        ${wlimit ? `<div class="word-limit-tag">📝 Word limit: ${this.escapeHtml(wlimit)}</div>` : ''}
        <textarea class="text-input" rows="${q.type === 'mcq' ? 4 : 6}" data-test-input="${this.escapeAttr(q.id)}" placeholder="Write your answer here...">${this.escapeHtml(value)}</textarea>
        <div class="word-counter ${wccls}" data-counter-for="${this.escapeAttr(q.id)}">
          ${wc} word${wc === 1 ? '' : 's'}${wlimit ? ` · target: ${this.escapeHtml(wlimit)}` : ''}
        </div>
      `;
    }

    return `
      <div class="test-question">
        <div class="test-q-header">
          <span class="test-q-num">Q${qnum}</span>
          <span class="test-q-type">${q.type.replace('_', ' ').toUpperCase()}</span>
          <span class="marks-tag">${q.marks} mark${q.marks > 1 ? 's' : ''}</span>
        </div>
        <p class="question-text">${this.escapeHtml(q.question)}</p>
        ${inputHtml}
      </div>
    `;
  },

  startTest() {
    this.state.testStartTime = Date.now();
    this.state.testAnswers = {};
    this.state.testTimeUp = false;
    this.state.testSubmitted = false;
    this.startTimer();
    this.render();
    this.scrollToTop();
  },

  captureTestInputs() {
    document.querySelectorAll('[data-test-input]').forEach(el => {
      const qid = el.dataset.testInput;
      this.state.testAnswers[qid] = { ...(this.state.testAnswers[qid] || {}), value: el.value };
    });
  },

  submitTest() {
    this.captureTestInputs();
    this.stopTimer();
    this.state.testSubmitted = true;
    this.saveProgress();
    this.render();
    // Scroll to the badge/score hero, not the top of the page
    requestAnimationFrame(() => {
      const hero = document.querySelector('.results-hero');
      if (hero) {
        hero.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        this.scrollToTop();
      }
    });
  },

  retakeTest() {
    if (!confirm('Retake the test? Your previous test answers will be cleared. (Other progress in Stages 1-3 stays.)')) return;
    this.state.testStartTime = null;
    this.state.testAnswers = {};
    this.state.testTimeUp = false;
    this.state.testSubmitted = false;
    this.saveProgress();
    this.render();
    this.scrollToTop();
  },

  // ============================================================
  // TIMER
  // ============================================================
  timerInterval: null,
  startTimer() {
    this.stopTimer();
    this.timerInterval = setInterval(() => {
      if (this.state.testSubmitted || this.state.testStartTime === null) {
        this.stopTimer();
        return;
      }
      const s = this.data.stage_4_test;
      const elapsed = Math.floor((Date.now() - this.state.testStartTime) / 1000);
      const remaining = Math.max(0, (s.duration_seconds || 2400) - elapsed);
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      const display = document.getElementById('timer-display');
      if (display) {
        display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        display.className = 'timer-display ' + (remaining < 60 ? 'urgent' : (remaining < 300 ? 'warning' : ''));
      }
      const progress = document.getElementById('timer-progress');
      if (progress) {
        const totalQuestions = s.sections.reduce((sum, sec) => sum + sec.questions.length, 0);
        // Capture current input values to keep "answered count" live without re-rendering
        document.querySelectorAll('[data-test-input]').forEach(el => {
          const qid = el.dataset.testInput;
          this.state.testAnswers[qid] = { ...(this.state.testAnswers[qid] || {}), value: el.value };
        });
        const answered = Object.keys(this.state.testAnswers).filter(k => {
          const v = this.state.testAnswers[k];
          return v && v.value !== undefined && String(v.value).trim() !== '';
        }).length;
        progress.textContent = `${answered} / ${totalQuestions} answered`;
      }
      if (remaining === 0 && !this.state.testTimeUp) {
        this.state.testTimeUp = true;
        this.stopTimer();
        this.submitTest();
      }
    }, 1000);
  },

  stopTimer() {
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
  },

  // ============================================================
  // RESULTS / SCORING
  // ============================================================
  computeStageScores() {
    // === STAGE 1: 1 ⭐ per correct answer (panels + spot-its). Total varies by chapter. ===
    const s1 = this.data.stage_1_learn;
    let s1Score = 0, s1Max = 0;
    s1.branches.forEach(b => {
      if (b.type === 'story_panels') {
        b.panels.forEach(p => {
          if (p.comprehension_check) {
            s1Max += 1;
            const a = this.state.panelChecks[p.id];
            if (a && a.selected === p.comprehension_check.correct) s1Score += 1;
          }
        });
      } else if (b.type === 'vocabulary_cards') {
        b.cards.forEach(c => {
          if (c.spot_it) {
            s1Max += 1;
            const a = this.state.spotItAnswers[c.id];
            if (a && a.correct) s1Score += 1;
          }
        });
      }
    });

    // === STAGE 2: 1 ⭐ per correct MCQ. ===
    const s2 = this.data.stage_2_practice;
    let s2Score = 0, s2Max = 0;
    s2.sections.forEach(sec => {
      sec.questions.forEach(q => {
        s2Max += 1;
        const a = this.state.practiceAnswers[q.id];
        if (a && a.selected === q.correct) s2Score += 1;
      });
    });

    // === STAGE 3: per problem = (1 if word-limit met) + (1 per ticked criterion, max 4) = 0..5 ===
    // Parent override (0..5) wins over self-check.
    const s3 = this.data.stage_3_think;
    let s3Score = 0, s3Max = 0;
    s3.problems.forEach(p => {
      s3Max += 5;  // every problem is worth exactly 5 stars
      const sub = this.state.thinkSubmissions[p.id];
      if (!sub || !sub.submitted) return;
      s3Score += this.scoreThinkProblemStars(p);
    });

    // === STAGE 4: marks (unchanged). ===
    const s4 = this.data.stage_4_test;
    const breakdown = this.gradeTestQuestions();
    const autoScore = breakdown.reduce((sum, b) => sum + b.marks_awarded, 0);
    const manualPotential = breakdown.filter(b => b.needs_manual).reduce((sum, b) => sum + b.q.marks, 0);
    const optimisticTotal = autoScore + manualPotential;
    const s4Max = s4.total_marks || 20;
    const s4Score = Math.round(Math.min(optimisticTotal, s4Max));

    return {
      stage1: { score: s1Score, max: s1Max, unit: 'stars' },
      stage2: { score: s2Score, max: s2Max, unit: 'stars' },
      stage3: { score: s3Score, max: s3Max, unit: 'stars' },
      stage4: { score: s4Score, max: s4Max, unit: 'marks', manualMarks: manualPotential, breakdown, rawAutoScore: autoScore, rawTotal: s4Max },
      // grandTotal kept for legacy callers but no longer headlined
      grandTotal: s1Score + s2Score + s3Score + s4Score,
      grandMax: s1Max + s2Max + s3Max + s4Max,
    };
  },

  // Stage 3 stars: independent components, 0..5 per problem.
  // Parent override (if set) overrides everything, clamped to 0..5.
  scoreThinkProblemStars(p) {
    const override = this.state.parentOverrides[p.id];
    if (override !== undefined && override !== null && override !== '') {
      const n = parseFloat(override);
      if (!isNaN(n)) return Math.max(0, Math.min(5, Math.round(n)));
    }
    const sub = this.state.thinkSubmissions[p.id];
    if (!sub || !sub.submitted) return 0;
    const answer = (sub.value || '').trim();
    if (!answer) return 0;

    let stars = 0;
    // 1 ⭐ for word-limit met (or if no word limit specified)
    const range = this.wordLimitRange(p.word_limit);
    if (range) {
      const wc = this.countWords(answer);
      if (wc >= range.min) stars += 1;
    } else {
      stars += 1; // no limit specified, give the writing star
    }
    // up to 4 ⭐ from self-check ticks
    const ticks = this.state.selfCheckTicks[p.id] || [];
    const tickedCount = ticks.filter(t => t === true).length;
    stars += Math.min(4, tickedCount);
    return Math.min(5, stars);
  },

  // Renders a small "How stars are calculated" info accordion at the bottom of each stage.
  // Stage 4 explains marks instead of stars.
  renderStarsInfoCard(stageNum) {
    const explanations = {
      1: {
        title: '⭐ How stars are earned in Learn',
        body: `<strong>1 ⭐ for every correct answer.</strong> Total stars depend on how many panels and vocabulary cards are in the chapter.<br><br>
               <em>Example:</em> If The Story has 5 panels with 5 questions, you can earn up to 5 ⭐ there. Plus 1 ⭐ for each correct "Spot it!" in Word Power.`
      },
      2: {
        title: '⭐ How stars are earned in Practice',
        body: `<strong>1 ⭐ for every correct answer.</strong> Each section has different numbers of questions.<br><br>
               <em>Example:</em> Section A with 4 questions → up to 4 ⭐. Get 3 right = ⭐ 3 / 4 stars.`
      },
      3: {
        title: '⭐ How stars are earned in Think Deeper',
        body: `Each question is worth up to <strong>5 ⭐</strong>:<br>
               • <strong>1 ⭐</strong> if you meet the word limit<br>
               • <strong>4 ⭐</strong> from the self-check (1 ⭐ per ticked criterion)<br><br>
               <em>Example:</em> You write 50 words (in range) and tick 3 of 4 criteria = 1 + 3 = ⭐ 4 / 5 stars.<br><br>
               A parent can override the score on any question — that override always wins.`
      },
      4: {
        title: '📋 How marks work in the Test',
        body: `The Test mirrors your school's exam format and is graded out of <strong>${(this.data.stage_4_test && this.data.stage_4_test.total_marks) || 20} marks</strong>:<br>
               • <strong>MCQs and fill-in-the-blanks</strong> are auto-graded.<br>
               • <strong>Short and long answers</strong> use the same self-check as Stage 3 (with parent override).<br><br>
               This is the only stage where school-style marks apply. Stages 1–3 are for learning, this is the assessment.`
      }
    };
    const e = explanations[stageNum];
    if (!e) return '';
    return `
      <details class="stars-info-card">
        <summary>${e.title}</summary>
        <div class="stars-info-body">${e.body}</div>
      </details>
    `;
  },

  gradeTestQuestions() {
    const s = this.data.stage_4_test;
    const out = [];
    s.sections.forEach(sec => {
      sec.questions.forEach(q => {
        const ans = this.state.testAnswers[q.id] || {};
        const userAnswer = (ans.value !== undefined ? String(ans.value) : '').trim();

        if (q.type === 'mcq') {
          const correct = userAnswer.toLowerCase() === String(q.correct_answer || '').toLowerCase();
          out.push({
            q, section: sec, user_answer: userAnswer,
            correct_display: q.correct_answer || '',
            is_correct: correct,
            marks_awarded: correct ? q.marks : 0,
            needs_manual: false,
            grading_type: 'auto',
          });
        } else if (q.type === 'fill_blank') {
          const norm = (s) => s.toLowerCase().trim().replace(/[.,;:!?'"]/g, '').replace(/\s+/g, ' ');
          const correct = norm(userAnswer) === norm(String(q.correct_answer || ''));
          out.push({
            q, section: sec, user_answer: userAnswer,
            correct_display: q.correct_answer || '',
            is_correct: correct,
            marks_awarded: correct ? q.marks : 0,
            needs_manual: false,
            grading_type: 'auto',
          });
        } else if (q.type === 'subjective_self_eval' && q.self_check_criteria && q.self_check_criteria.length > 0) {
          // Self-check based grading (with parent override support)
          const score = this.scoreSubjectiveSelfEval(q, q.marks);
          out.push({
            q, section: sec, user_answer: userAnswer,
            correct_display: '(self-checked)',
            is_correct: null,
            marks_awarded: score.marks,
            needs_manual: false,
            grading_type: score.source,  // 'self_check' | 'parent' | 'engagement' | 'no_answer'
          });
        } else {
          // Legacy: short_answer or subjective without criteria — manual (optimistic full marks for display)
          out.push({
            q, section: sec, user_answer: userAnswer,
            correct_display: '(See model answer)',
            is_correct: null,
            marks_awarded: 0,
            needs_manual: true,
            grading_type: 'manual',
          });
        }
      });
    });
    return out;
  },

  getBadge(percentage) {
    const badges = this.data.badges || {};
    if (badges.champion && percentage >= badges.champion.threshold) return badges.champion;
    if (badges.star && percentage >= badges.star.threshold) return badges.star;
    if (badges.spark && percentage >= badges.spark.threshold) return badges.spark;
    return null;
  },

  // Secondary tier message based on absolute test score.
  // Uses the chapter's own score_tiers (min/max/message) so the scale matches
  // the school's real total (e.g. 20 marks), not a hardcoded 25. Always shown
  // alongside the badge, never replacing it.
  getSecondaryMessage(testScore) {
    const s4 = this.data.stage_4_test || {};
    const tiers = s4.score_tiers || [];
    for (const t of tiers) {
      const lo = (typeof t.min === 'number') ? t.min : -Infinity;
      const hi = (typeof t.max === 'number') ? t.max : Infinity;
      if (testScore >= lo && testScore <= hi) return t.message;
    }
    return '';
  },

  renderResults() {
    const scores = this.computeStageScores();
    const testScore = scores.stage4.score;
    const testMax = scores.stage4.max;
    const testPercentage = testMax > 0 ? Math.round((testScore / testMax) * 100) : 0;

    // Secondary message based on test score (uses the chapter's score_tiers)
    const secondaryMessage = this.getSecondaryMessage(testScore);

    // Stars earned across Stages 1-3
    const starsEarned = scores.stage1.score + scores.stage2.score + scores.stage3.score;
